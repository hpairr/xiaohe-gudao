<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图案星图 · 潇贺古道有声文化数据库</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1D2652">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
@font-face{font-family:'Noto Serif SC';src:url('assets/fonts/site/NotoSerifSC-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Noto Serif SC';src:url('assets/fonts/site/NotoSerifSC-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Noto Sans SC';src:url('assets/fonts/site/NotoSansSC-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Noto Sans SC';src:url('assets/fonts/site/NotoSansSC-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}

:root{
  --paper:#F3EEE3;
  --paper-deep:#E9E1D1;
  --ink:#1D2652;
  --ink-soft:#3A4160;
  --muted:#5F5A50;
  --red:#A9362E;
  --teal:#2C5A4E;
  --line:rgba(29,38,82,.18);
  --line-soft:rgba(29,38,82,.1);
  --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',STSong,'SimSun',serif;
  --sans:'Noto Sans SC','Source Han Sans SC','Microsoft YaHei','PingFang SC',sans-serif;
  --pad:clamp(18px,4vw,56px);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:400 14px/1.7 var(--sans);-webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.18em}
a:hover{color:var(--red)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--red);outline-offset:4px}

.skip{position:fixed;left:12px;top:-60px;z-index:200;background:var(--ink);color:var(--paper);padding:10px 14px;text-decoration:none;font-size:12px}
.skip:focus{top:12px}

/* 顶栏 */
.top{
  position:fixed;left:0;right:0;top:0;z-index:40;
  display:flex;align-items:flex-start;justify-content:space-between;gap:24px;
  padding:20px var(--pad) 0;pointer-events:none;
}
.top > *{pointer-events:auto}
.brand{display:flex;flex-direction:column;gap:2px;line-height:1.1}
.brand b{font:700 clamp(18px,2vw,24px)/1.1 var(--serif);letter-spacing:-.02em}
.brand span{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.hint{margin:4px 0 0;font-size:10px;letter-spacing:.06em;color:var(--muted)}
.top-right{display:flex;align-items:center;gap:20px}
.back{font-size:10.5px;letter-spacing:.06em;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
.back:hover{color:var(--ink)}

/* 星图 */
.stage-wrap{position:fixed;inset:0;display:grid;place-items:center;padding:76px 0 92px}
.stage{
  position:relative;
  width:min(1120px,94vw,calc(72vh * 1120 / 760));
  aspect-ratio:1120/760;
  height:auto;
}
.stage svg.links{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.stage svg.links path{
  fill:none;stroke:var(--ink);stroke-width:1;stroke-linecap:round;
  opacity:.42;vector-effect:non-scaling-stroke;
  transition:opacity .25s,stroke-width .25s;
}
.stage svg.links path.is-on{
  opacity:1;stroke-width:1.6;
  stroke-dasharray:3 5;
  animation:flow .9s linear infinite;
}
@keyframes flow{to{stroke-dashoffset:-16}}

.orbits{position:absolute;inset:0;pointer-events:none}
.orbits i{position:absolute;left:50%;top:50%;border:1px solid var(--line-soft);border-radius:50%;transform:translate(-50%,-50%)}
.orbits .o1{width:38%;aspect-ratio:1}
.orbits .o2{width:57%;aspect-ratio:1;border-style:dashed;opacity:.6}
.orbits .o3{width:76%;aspect-ratio:1;opacity:.45}

.core{
  position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;
  transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;
  z-index:3;
}
.core-img{
  width:78%;aspect-ratio:1;border-radius:50%;overflow:hidden;
  border:1px solid var(--ink);background:var(--paper-deep);
  box-shadow:0 0 0 7px var(--paper);
}
.core-img img{width:100%;height:100%;object-fit:cover;display:block}
.core-ring{
  position:absolute;width:100%;aspect-ratio:1;border-radius:50%;
  border:1px dashed rgba(29,38,82,.32);
  animation:spin 70s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.core-label{
  position:absolute;left:50%;top:calc(100% + 10px);transform:translateX(-50%);
  text-align:center;white-space:nowrap;
  background:var(--paper);padding:3px 10px 4px;z-index:2;
}
.core-label b{display:block;font:500 16px/1.2 var(--serif);letter-spacing:.02em}
.core-label span{display:block;margin-top:3px;font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

.nodes{position:absolute;inset:0;z-index:4}
.node-group{display:none}
.node-group.is-visible{display:block}
.node{
  position:absolute;width:7.2%;aspect-ratio:1;
  transform:translate(-50%,-50%);
  border:0;background:none;padding:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;
}
.node-img{
  position:relative;display:block;width:100%;aspect-ratio:1;border-radius:50%;
  overflow:hidden;border:1.5px solid var(--cat,var(--ink));
  background:var(--paper-deep);
  transition:transform .3s var(--ease),box-shadow .3s;
}
.node-img img{width:100%;height:100%;object-fit:cover;display:block}
.node:hover .node-img,.node:focus-visible .node-img{transform:scale(1.08);box-shadow:0 8px 18px rgba(29,38,82,.13)}
.node.is-plain .node-img{border-style:dashed;background:var(--paper)}
.node.is-plain .node-img::after{
  content:"装饰";position:absolute;inset:0;display:grid;place-items:center;
  font-size:10px;letter-spacing:.08em;color:var(--muted);
}
.node-no{
  position:absolute;left:-2px;top:-4px;z-index:2;
  display:grid;place-items:center;min-width:20px;height:16px;padding:0 4px;
  background:var(--ink);color:var(--paper);font-size:8px;letter-spacing:.04em;
  font-variant-numeric:tabular-nums;
}
.node-label{
  position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);
  width:118px;text-align:center;font-size:10.5px;line-height:1.35;letter-spacing:.01em;
  color:var(--ink-soft);pointer-events:none;
}
.node.is-plain .node-label{color:var(--muted)}
.node.is-on .node-label{color:var(--red)}
.node.is-on .node-img{border-color:var(--red)!important}

/* 主题轨 */
.rail{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:35;
  display:flex;align-items:center;gap:24px;
  padding:8px 4px 7px;max-width:94vw;overflow-x:auto;scrollbar-width:none;
  background:var(--paper);
}
.rail::-webkit-scrollbar{display:none}
.rail button{
  position:relative;background:none;border:0;padding:0 0 7px;cursor:pointer;
  display:flex;align-items:baseline;gap:5px;white-space:nowrap;
  font-size:10.5px;letter-spacing:.06em;color:var(--muted);
  border-bottom:1px solid transparent;
}
.rail button .n{font-size:8px;letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums}
.rail button:hover{color:var(--ink)}
.rail button[aria-current="true"]{color:var(--red);border-bottom-color:var(--red)}
.rail button[aria-current="true"] .n{color:var(--red)}

.legend{position:fixed;left:var(--pad);bottom:22px;z-index:36;display:flex;gap:14px;align-items:center;font-size:9px;letter-spacing:.04em;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{width:6px;height:6px;display:block}
@media (max-width:1100px){.legend{display:none}}

/* 跟随预览 */
.preview{
  position:fixed;left:0;top:0;width:250px;z-index:80;pointer-events:none;
  opacity:0;visibility:hidden;will-change:transform;
}
.preview-img{
  aspect-ratio:1;background:var(--paper);border:1px solid var(--line);
  padding:8px;box-shadow:0 16px 34px rgba(29,38,82,.12);
}
.preview-img img{width:100%;height:100%;object-fit:contain;display:block}
.preview-cap{display:flex;align-items:baseline;gap:7px;padding:7px 2px 0;font-size:9.5px;letter-spacing:.05em;color:var(--muted)}
.preview-cap b{font:500 11.5px/1.3 var(--serif);color:var(--ink)}
.preview-cap .pno{color:var(--red);font-variant-numeric:tabular-nums}

/* 侧栏 */
.panel{
  position:fixed;right:0;top:0;bottom:0;width:min(360px,92vw);z-index:90;
  background:var(--paper);border-left:1px solid var(--line);
  transform:translateX(105%);transition:transform .5s var(--ease);
  display:flex;flex-direction:column;overflow-y:auto;
  padding:26px 26px 30px;
}
.panel.is-open{transform:translateX(0)}
.panel-close{
  position:absolute;right:14px;top:14px;width:34px;height:34px;border:1px solid var(--line);
  border-radius:50%;background:var(--paper);cursor:pointer;font-size:16px;line-height:1;
}
.panel-close:hover{background:var(--ink);color:var(--paper)}
.panel-img{width:100%;max-height:300px;object-fit:contain;background:var(--paper-deep);border:1px solid var(--line-soft);margin-top:34px}
.panel-kicker{margin:18px 0 0;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.panel h2{margin:7px 0 0;font:700 30px/1.15 var(--serif);letter-spacing:-.03em}
.panel-tag{margin:8px 0 0;font-size:9.5px;letter-spacing:.1em;color:var(--muted)}
.panel-desc{margin:15px 0 0;font-size:13px;line-height:1.85;color:var(--ink-soft)}
.panel-source{margin:12px 0 0;font-size:10.5px;line-height:1.7;color:var(--muted)}
.panel-links{display:flex;flex-wrap:wrap;gap:16px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:10.5px}
.panel-links a{text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px}
.panel-plain{margin:44px 0 0;font:500 24px/1.4 var(--serif);color:var(--ink)}
.panel-plain small{display:block;margin-top:8px;font:400 12px/1.7 var(--sans);color:var(--muted)}

/* 响应式：手机退化为纵向树 */
@media (max-width:820px){
  body{overflow:auto;overflow-x:hidden}
  .top{padding-top:14px}
  .hint{display:none}
  .stage-wrap{position:relative;inset:auto;display:block;padding:86px 20px 96px}
  .stage{height:auto;aspect-ratio:auto;max-width:none;width:100%}
  .orbits,.stage svg.links{display:none}
  .core{position:relative;left:auto;top:auto;transform:none;width:210px;height:auto;aspect-ratio:auto;margin:0 auto;display:flex;flex-direction:column}
  .core-label{position:static;transform:none;margin-top:12px}
  .nodes{position:relative;inset:auto;margin-top:26px;display:flex;flex-direction:column;gap:0}
  .node-group.is-visible{display:flex;flex-direction:column;position:relative;padding-left:20px}
  .node-group.is-visible::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:1px;background:var(--line)}
  .node::before{content:"";position:absolute;left:-20px;top:50%;width:20px;height:1px;background:var(--line);pointer-events:none}
  .node{
    position:relative!important;left:auto!important;top:auto!important;transform:none!important;
    width:100%;display:grid;grid-template-columns:64px 1fr;align-items:center;gap:14px;aspect-ratio:auto;
    padding:11px 0;border-bottom:1px solid var(--line-soft);text-align:left;
  }
  .node-img{width:64px}
  .node-label{position:static;transform:none;width:auto;text-align:left;font-size:12.5px;pointer-events:auto}
  .node-label::after{display:block}
  .node-no{left:0;top:0}
  .node.is-on .node-img{border-color:var(--ink)!important}
  .rail{bottom:0;left:0;transform:none;width:100%;max-width:none;padding:10px 20px;border-top:1px solid var(--line);gap:20px}
  .legend{display:none}
  .preview{display:none}
  .panel{width:100%;top:auto;height:62vh;border-left:0;border-top:1px solid var(--line);transform:translateY(105%);border-radius:0}
  .panel.is-open{transform:translateY(0)}
  .panel-img{max-height:150px;margin-top:30px}
  .panel h2{font-size:26px}
}
@media (hover:none){.preview{display:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .core-ring{animation:none}
  .preview{display:none}
}
</style>
</head>

n":false}]},{"id":"drum","name":"长鼓舞","en":"LONG DRUM DANCE","intro":"长鼓是器物。鼓身、鼓面、鼓点各有各的形，画面把三者叠在一个 X 上。","page":"themes/04-长鼓舞.html","plate":"assets/img/motifs/m3-drum.webp","items":[{"no":"03","name":"外框方块","cat":"original","desc":"普通装饰图，不作解释。","source":"","img":"","plain":true},{"no":"05","name":"内框图形","cat":"original","desc":"普通装饰图，不作解释。","source":"","img":"","plain":true},{"no":"06","name":"三框","cat":"sound","desc":"三重方框一层层收进，框距按鼓点分组，像拍打时一次比一次紧。","source":"自创：按鼓点分组","img":"assets/theme-pattern/thumbs/drum-06.webp","plain":false},{"no":"07","name":"内框花纹","cat":"traditional","desc":"山形锯齿与菱形回钩一正一反地连续，借瑶锦花边的横向节奏。","source":"参考：瑶锦二方连续（锯齿+菱形回纹）","img":"assets/theme-pattern/thumbs/drum-07.webp","plain":false},{"no":"08","name":"鼓花","cat":"traditional","desc":"八角花与八瓣花叠在鼓面中心，鼓身交叉后形成旋转感。","source":"参考：瑶族八角花/八瓣花","img":"assets/theme-pattern/thumbs/drum-08.webp","plain":false},{"no":"09","name":"鼓身","cat":"architecture","desc":"两只细腰鼓交叉成 X，保留鼓皮、腰线和彩绘的分段。","source":"参考：长鼓鼓身彩绘","img":"assets/theme-pattern/thumbs/drum-09.webp","plain":false}]},{"id":"bridge","name":"富川风雨桥","en":"WIND-RAIN BRIDGE","intro":"风雨桥是建筑。窗棂、瓦檐、翘角被拆成边饰，桥亭只留在中心。","page":"themes/05-风雨桥.html","plate":"assets/img/motifs/m4-bridge.webp","items":[{"no":"03","name":"外框花纹","cat":"architecture","desc":"桥廊木窗的格心，方框套方框，像从窗里看出去。","source":"参考：富川风雨桥木窗照片","img":"assets/theme-pattern/thumbs/bridge-03.webp","plain":false},{"no":"04","name":"内框花纹","cat":"architecture","desc":"窗棂的十字格与井字格密排，做出桥廊的进深。","source":"参考：富川风雨桥木窗照片","img":"assets/theme-pattern/thumbs/bridge-04.webp","plain":false},{"no":"05","name":"最外框花纹","cat":"architecture","desc":"檐口瓦片的正负形，一排压一排，收住最外圈。","source":"参考：风雨桥瓦檐照片","img":"assets/theme-pattern/thumbs/bridge-05.webp","plain":false},{"no":"06","name":"内框房檐","cat":"architecture","desc":"四角翘起的屋檐，正负形各取一半，拼成四片飞檐。","source":"参考：风雨桥翼角照片","img":"assets/theme-pattern/thumbs/bridge-06.webp","plain":false},{"no":"07","name":"角落内框花纹","cat":"architecture","desc":"从房檐起翘和瓦当取形，做角部的填充纹。","source":"参考：风雨桥翼角与瓦当","img":"assets/theme-pattern/thumbs/bridge-07.webp","plain":false}]},{"id":"panwang","name":"盘王大歌","en":"PANWANG DA GE","intro":"盘王大歌是歌书。页框、七任曲的环、盘王印的方心，组成一套可读的版式。","page":"themes/06-盘王大歌.html","plate":"assets/img/motifs/m5-panwang.webp","items":[{"no":"02","name":"内框花纹","cat":"traditional","desc":"盘王印外圈的粗细线，一粗一细交替，像朱文与白文的印边。","source":"参考：盘王印外圈线","img":"assets/theme-pattern/thumbs/panwang-02.webp","plain":false},{"no":"03","name":"外框角落花纹","cat":"traditional","desc":"盘王印章型的角块，四角压住，给页框一个落印的位置。","source":"参考：盘王印章形纹","img":"assets/theme-pattern/thumbs/panwang-03.webp","plain":false},{"no":"04","name":"外框花纹","cat":"traditional","desc":"盘王经典纹样的横向带，三角与联珠交替，围住七任曲的环。","source":"参考：盘王经典纹样","img":"assets/theme-pattern/thumbs/panwang-04.webp","plain":false},{"no":"05","name":"内框花","cat":"traditional","desc":"大八角花形，八出放射，是盘王印里最常见的花心。","source":"参考：大八角花形纹","img":"assets/theme-pattern/thumbs/panwang-05.webp","plain":false},{"no":"06","name":"中心","cat":"traditional","desc":"方心外方内八角，中心一点收住。形制参照连南、乳源的盘王印，不作本地实物。","source":"参考：盘王印（连南/乳源）","img":"assets/theme-pattern/thumbs/panwang-06.webp","plain":false}]},{"id":"brocade","name":"瑶族织锦","en":"YAO BROCADE","intro":"织锦是经纬。万字、菱格、锯齿、挑花都按经线显花的逻辑排。","page":"themes/07-富川织锦.html","plate":"assets/img/motifs/m6-brocade.webp","items":[{"no":"02","name":"内框花纹","cat":"traditional","desc":"据织锦边饰重画的折线带，锯齿与小花交替。","source":"参考：富川瑶锦边饰","img":"assets/theme-pattern/thumbs/brocade-02.webp","plain":false},{"no":"03","name":"内框中间花纹","cat":"traditional","desc":"菱形花按八出排开，像经线显花后的放射。","source":"参考：瑶锦菱形花","img":"assets/theme-pattern/thumbs/brocade-03.webp","plain":false},{"no":"04","name":"中心","cat":"traditional","desc":"白框挑花里的卍字与十字变体，是织锦的中心花。中心直接用织好的挑花，不再另起一版。","source":"参考：瑶锦挑花中心","img":"assets/theme-pattern/thumbs/brocade-04.webp","plain":false},{"no":"05","name":"内框左右花纹","cat":"traditional","desc":"卍字与回纹的连续带，左右各一条，像织片的经向边。","source":"参考：瑶锦万字连续纹","img":"assets/theme-pattern/thumbs/brocade-05.webp","plain":false},{"no":"06","name":"外框上下花纹","cat":"traditional","desc":"万字与菱格一上一下压边，是织锦里常见的收口。","source":"参考：瑶锦万字+菱格","img":"assets/theme-pattern/thumbs/brocade-06.webp","plain":false},{"no":"08","name":"内框角落花纹","cat":"traditional","desc":"角落的小块嵌色方格，不单独成纹，只负责收角。","source":"参考：瑶锦角落嵌色","img":"assets/theme-pattern/thumbs/brocade-08.webp","plain":false}]}]</script>
<script src="assets/js/gsap.min.js"></script>
<script>
(function () {
  'use strict';
  var DATA = JSON.parse(document.getElementById('theme-data').textContent);
  var CAT = {traditional:'传统纹样', architecture:'建筑与器物', sound:'声音与结构', original:'原创装饰'};
  var CAT_COLOR = {traditional:'#A9362E', architecture:'#3A4160', sound:'#2C5A4E', original:'#5F5A50'};
  var W = 1120, H = 760, CX = W / 2, CY = H / 2;
  var stage = document.getElementById('stage');
  var svg = document.getElementById('links');
  var nodesWrap = document.getElementById('nodes');
  var coreImg = document.getElementById('coreImg');
  var coreName = document.getElementById('coreName');
  var coreEn = document.getElementById('coreEn');
  var rail = document.getElementById('rail');
  var preview = document.getElementById('preview');
  var pImg = document.getElementById('previewImg');
  var pNo = document.getElementById('previewNo');
  var pName = document.getElementById('previewName');
  var pTheme = document.getElementById('previewTheme');
  var panel = document.getElementById('panel');
  panel.inert = true;
  var panelImg = document.getElementById('panelImg');
  var panelKicker = document.getElementById('panelKicker');
  var panelTitle = document.getElementById('panelTitle');
  var panelTag = document.getElementById('panelTag');
  var panelDesc = document.getElementById('panelDesc');
  var panelSource = document.getElementById('panelSource');
  var panelTheme = document.getElementById('panelTheme');
  var panelLayers = document.getElementById('panelLayers');
  var panelClose = document.getElementById('panelClose');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
  var mobile = matchMedia('(max-width:820px)').matches;
  var current = 0;
  var groups = [];
  var busy = true;
  var lastFocus = null;

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }

  function buildRail() {
    DATA.forEach(function (t, i) {
      var b = el('button', '', '<span class="n">' + String(i + 1).padStart(2, '0') + '</span><span>' + t.name + '</span>');
      b.type = 'button';
      b.dataset.i = i;
      b.addEventListener('click', function () { switchTheme(i); });
      rail.appendChild(b);
    });
  }

  function position(i, n) {
    var angle = -Math.PI / 2 + i * (Math.PI * 2 / n);
    var wob = (i % 2 ? -8 : 8);
    var rx = 330 + wob;
    var ry = 270 + wob * .6;
    var x = CX + Math.cos(angle) * rx;
    var y = CY + Math.sin(angle) * ry;
    return {x: x, y: y, angle: angle};
  }

  function curve(x1, y1, x2, y2, sign) {
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    var dx = x2 - x1, dy = y2 - y1;
    var len = Math.hypot(dx, dy) || 1;
    var px = -dy / len, py = dx / len;
    var off = (sign > 0 ? 26 : -26);
    return 'M' + x1.toFixed(1) + ' ' + y1.toFixed(1) +
      ' Q' + (mx + px * off).toFixed(1) + ' ' + (my + py * off).toFixed(1) +
      ' ' + x2.toFixed(1) + ' ' + y2.toFixed(1);
  }

  function buildGroup(t, ti) {
    var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    var group = el('div', 'node-group');
    group.dataset.theme = t.id;

    var n = t.items.length;
    var nodes = [];
    t.items.forEach(function (it, i) {
      var p = position(i, n);
      var node = el('button', 'node' + (it.plain ? ' is-plain' : ''));
      node.type = 'button';
      node.dataset.i = i;
      node.dataset.cat = it.cat;
      node.style.left = (p.x / W * 100) + '%';
      node.style.top = (p.y / H * 100) + '%';
      node.style.setProperty('--cat', CAT_COLOR[it.cat]);
      node.setAttribute('aria-label', it.name + '，' + CAT[it.cat] + (it.plain ? '，普通装饰图' : ''));
      var img = '';
      if (!it.plain && it.img) {
        img = '<img src="' + it.img + '" alt="" width="420" height="420" loading="eager" decoding="async">';
      }
      node.innerHTML =
        '<span class="node-img">' + img + '</span>' +
        '<span class="node-no">' + it.no + '</span>' +
        '<span class="node-label">' + it.name + '</span>';

      var nodeR = 0.072 * W * 0.5; // 节点半径（按 1120 宽）
      var coreR = 0.26 * W * 0.78 * 0.5; // 中心图案半径
      var dx = p.x - CX, dy = p.y - CY;
      var d = Math.hypot(dx, dy) || 1;
      var sx = CX + dx / d * coreR;
      var sy = CY + dy / d * coreR;
      var ex = p.x - dx / d * (nodeR + 4);
      var ey = p.y - dy / d * (nodeR + 4);
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', curve(sx, sy, ex, ey, i % 2 ? 1 : -1));
      g.appendChild(path);
      node._path = path;
      nodes.push(node);
      group.appendChild(node);
    });

    svg.appendChild(g);
    nodesWrap.appendChild(group);
    groups.push({theme: t, g: g, nodes: nodes, group: group, paths: Array.prototype.slice.call(g.querySelectorAll('path'))});
    return groups[groups.length - 1];
  }

  function setGroupVisible(grp, on) {
    grp.group.classList.toggle('is-visible', on);
    grp.g.style.display = on ? '' : 'none';
  }

  function measure(grp) {
    grp.paths.forEach(function (p) {
      var len = p.getTotalLength();
      p._len = len;
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
    });
  }

  function updateCore(t) {
    coreImg.src = t.plate;
    coreImg.alt = t.name + '图案';
    coreName.textContent = t.name;
    coreEn.textContent = t.en;
    coreImg.classList.remove('is-fade');
  }

  function showTheme(index, first, done) {
    var t = DATA[index];
    var grp = groups[index];
    if (!grp) { if (done) done(); return; }
    updateCore(t);

    // 先隐藏其他组
    groups.forEach(function (x, i) { if (i !== index) setGroupVisible(x, false); });
    setGroupVisible(grp, true);
    measure(grp);

    if (reduce) {
      gsap.set(coreImg, { autoAlpha: 1, scale: 1 });
      gsap.set(grp.paths, { strokeDashoffset: 0, opacity: .42 });
      gsap.set(grp.nodes, { autoAlpha: 1, scale: 1 });
      current = index;
      Array.prototype.forEach.call(rail.children, function (b, i) {
        if (i === index) b.setAttribute('aria-current', 'true');
        else b.removeAttribute('aria-current');
      });
      if (done) done();
      return;
    }

    var tl = gsap.timeline({ defaults: { ease: 'power2.out' } });

    if (!first) {
      gsap.set(coreImg, { autoAlpha: 0, scale: .94 });
    }

    tl.to(coreImg, { autoAlpha: 1, scale: 1, duration: .55, ease: 'power3.out' }, 0);
    tl.fromTo(grp.paths, { strokeDashoffset: function (i, p) { return p._len; }, opacity: 0 },
      { strokeDashoffset: 0, opacity: .42, duration: .45, stagger: .05, ease: 'power2.inOut' }, .03);
    tl.fromTo(grp.nodes, { autoAlpha: 0, scale: .55 },
      { autoAlpha: 1, scale: 1, duration: .45, stagger: .04, ease: 'back.out(1.6)' }, .06);

    current = index;
    Array.prototype.forEach.call(rail.children, function (b, i) {
      if (i === index) b.setAttribute('aria-current', 'true');
      else b.removeAttribute('aria-current');
    });
    if (done) tl.eventCallback('onComplete', done);
  }

  function switchTheme(index) {
    if (busy || index === current) return;
    busy = true;
    closePanel();
    hidePreview();
    var old = groups[current];
    if (reduce) {
      setGroupVisible(old, false);
      showTheme(index, false, function () { busy = false; });
      return;
    }
    var tl = gsap.timeline({ defaults: { ease: 'power2.in' } });
    tl.to(old.nodes, { autoAlpha: 0, scale: .55, duration: .2, stagger: { each: .015, from: 'end' } }, 0);
    tl.to(old.paths, { strokeDashoffset: function (i, p) { return p._len; }, opacity: 0, duration: .2, stagger: { each: .015, from: 'end' } }, 0);
    tl.to(coreImg, { autoAlpha: 0, scale: .94, duration: .2 }, 0);
    tl.add(function () {
      setGroupVisible(old, false);
      showTheme(index, false, function () { busy = false; });
    }, .18);
  }

  /* 预览 */
  var gx = null, gy = null, gr = null, px = 0, py = 0, lastX = 0;
  if (window.gsap && fine && !mobile && !reduce) {
    gx = gsap.quickTo(preview, 'x', { duration: .48, ease: 'power3' });
    gy = gsap.quickTo(preview, 'y', { duration: .48, ease: 'power3' });
    gr = gsap.quickTo(preview, 'rotate', { duration: .55, ease: 'power3' });
  }

  function movePreview(e) {
    if (!preview.classList.contains('is-on')) return;
    var w = 250, h = 290, pad = 24;
    var x = e.clientX + pad, y = e.clientY + pad;
    if (x + w > innerWidth - 12) x = e.clientX - w - pad;
    if (y + h > innerHeight - 12) y = e.clientY - h - pad;
    x = Math.max(12, x); y = Math.max(12, y);
    if (gx) { gx(x); gy(y); gr(Math.max(-4, Math.min(4, (e.clientX - lastX) * .08))); }
    else preview.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
    lastX = e.clientX;
  }

  function showPreview(e, node, item, theme) {
    if (!fine || mobile || reduce || item.plain) return;
    pImg.src = item.img;
    pImg.alt = theme.name + ' ' + item.name;
    pNo.textContent = item.no;
    pName.textContent = item.name;
    pTheme.textContent = theme.name;
    preview.classList.add('is-on');
    preview.style.visibility = 'visible';
    if (window.gsap && gx) {
      gsap.killTweensOf(preview);
      gsap.fromTo(preview, { autoAlpha: 0, scale: .92, rotate: -2 },
        { autoAlpha: 1, scale: 1, rotate: 0, duration: .35, ease: 'power3.out', overwrite: 'auto' });
    } else {
      preview.style.opacity = '1';
    }
    movePreview(e);
  }

  function hidePreview() {
    preview.classList.remove('is-on');
    if (window.gsap && gx && !reduce) {
      gsap.to(preview, { autoAlpha: 0, scale: .94, duration: .2, ease: 'power2.in', overwrite: 'auto' });
    } else {
      preview.style.opacity = '0';
      preview.style.visibility = 'hidden';
    }
  }

  /* 面板 */
  function openPanel(item, theme) {
    if (item.plain) return;
    hidePreview();
    lastFocus = document.activeElement;
    panelImg.src = item.img;
    panelImg.alt = theme.name + ' ' + item.name;
    panelKicker.textContent = theme.name + ' · ' + item.no;
    panelTitle.textContent = item.name;
    panelTag.textContent = CAT[item.cat] || '';
    panelTag.style.color = CAT_COLOR[item.cat] || '';
    panelDesc.textContent = item.desc;
    panelSource.textContent = item.source ? '依据：' + item.source : '';
    panelTheme.textContent = '回到' + theme.name;
    panelTheme.href = theme.page;
    panelLayers.href = 'motifs-layers.html?theme=' + theme.id;
    panel.classList.add('is-open');
    panel.setAttribute('aria-hidden', 'false');
    panel.inert = false;
    setTimeout(function () { panelClose.focus(); }, 40);
  }

  function closePanel() {
    panel.classList.remove('is-open');
    panel.setAttribute('aria-hidden', 'true');
    panel.inert = true;
    if (lastFocus && document.contains(lastFocus)) { lastFocus.focus(); lastFocus = null; }
  }

  panelClose.addEventListener('click', closePanel);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanel(); });

  /* 绑定 */
  function bind() {
    groups.forEach(function (grp, ti) {
      var theme = grp.theme;
      grp.nodes.forEach(function (node, i) {
        var item = theme.items[i];
        node.addEventListener('pointerenter', function (e) {
          grp.paths[i].classList.add('is-on');
          node.classList.add('is-on');
          showPreview(e, node, item, theme);
        });
        node.addEventListener('pointermove', function (e) {
          if (e.pointerType === 'touch') return;
          movePreview(e);
        });
        node.addEventListener('pointerleave', function () {
          grp.paths[i].classList.remove('is-on');
          node.classList.remove('is-on');
          hidePreview();
        });
        node.addEventListener('click', function () {
          if (item.plain) return;
          openPanel(item, theme);
        });
      });
    });
  }

  /* 启动 */
  buildRail();
  DATA.forEach(function (t, i) { buildGroup(t, i); });
  bind();
  showTheme(0, true, function () { busy = false; });
  if (window.gsap && !reduce) {
    gsap.from('.top, .rail', { autoAlpha: 0, y: 8, duration: .6, stagger: .08, ease: 'power2.out' });
  }
  addEventListener('resize', function () { if (mobile) hidePreview(); });
  addEventListener('scroll', hidePreview, { passive: true });
})();
</script>
</body>
</html>
