<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>即将离开本站 · 潇贺古道有声文化数据库</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0E0C">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23B63A33'/%3E%3Cpath d='M14 44c8-2 8-20 16-20s8 16 16 14' fill='none' stroke='%23F2EDE2' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ============================================================
   潇贺古道 · 中转提示页（Interstitial）
   用法：leave.html?to=<外部地址>&from=<来源页>&tab=1&auto=0
   视觉只留首页那套令牌：墨黑底、纸色字、朱砂一处强调，
   字体为 Noto Serif SC + Noto Sans SC。没有插图、纹理与装饰线条。
   ============================================================ */

@font-face{font-family:'Noto Serif SC';src:url('assets/fonts/site/NotoSerifSC-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Noto Serif SC';src:url('assets/fonts/site/NotoSerifSC-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Noto Sans SC';src:url('assets/fonts/site/NotoSansSC-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Noto Sans SC';src:url('assets/fonts/site/NotoSansSC-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}

:root{
  --paper:#F2EDE2;
  --ink:#141A16;
  --ink-2:#0A0E0C;
  --cinnabar:#B63A33;
  --gold:#D2A03F;
  --line:rgba(242,237,226,.16);
  --f-serif:'Noto Serif SC','Source Han Serif SC','Songti SC',STSong,serif;
  --f-sans:'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --f-en:'Bahnschrift','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --pad:clamp(20px,3.2vw,48px);
}

*{box-sizing:border-box}
html{background:var(--ink-2);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);
  background:var(--ink-2);color:var(--paper);
  font-family:var(--f-sans);font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--cinnabar);color:var(--paper)}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- 顶栏 ---------- */
.bar{
  display:flex;align-items:center;gap:16px;
  padding:16px var(--pad);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{
  width:30px;height:30px;display:grid;place-items:center;
  background:var(--cinnabar);color:var(--paper);
  font-family:var(--f-serif);font-weight:700;font-size:16px;line-height:1;
}
.brand-txt{display:flex;flex-direction:column;line-height:1.2}
.brand-cn{font-family:var(--f-serif);font-weight:700;font-size:17px;letter-spacing:.1em}
.brand-en{font:9px/1.4 var(--f-en);letter-spacing:.2em;opacity:.55;margin-top:2px}
.bar-tag{
  margin-left:auto;font:10px/1 var(--f-en);letter-spacing:.2em;text-transform:uppercase;
  color:rgba(242,237,226,.55);
}
.bar-tag b{font-family:var(--f-serif);font-weight:500;font-size:11px;letter-spacing:.14em;color:var(--gold);margin-right:6px}

/* ---------- 主区 ---------- */
.main{
  display:grid;align-content:center;min-width:0;
  padding:clamp(36px,7vh,80px) var(--pad);
}
.sheet{width:min(100%,700px);margin:0 auto;min-width:0}

.label{
  display:flex;align-items:center;gap:10px;margin:0 0 clamp(14px,2.4vh,22px);
  font:10px/1 var(--f-en);letter-spacing:.22em;text-transform:uppercase;
  color:rgba(242,237,226,.55);
}
.label i{display:block;width:26px;height:1px;background:var(--cinnabar);flex:none}

h1{
  margin:0;font-family:var(--f-serif);font-weight:700;
  font-size:clamp(28px,3.6vw,42px);line-height:1.3;letter-spacing:.02em;
}

.lede{
  max-width:34em;margin:clamp(12px,2vh,18px) 0 0;
  font-size:clamp(14px,1.05vw,16px);line-height:1.95;
  color:rgba(242,237,226,.7);text-wrap:pretty;
}

/* 目标地址：只用一条上、一条下细线，不画框 */
.dest{
  margin-top:clamp(26px,4.6vh,44px);padding:clamp(14px,2.2vh,20px) 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  min-width:0;
}
.dest-head{
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font:9px/1.6 var(--f-en);letter-spacing:.18em;text-transform:uppercase;
  color:rgba(242,237,226,.45);
}
.dest-head b{font-family:var(--f-serif);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:none;color:rgba(242,237,226,.8);margin-left:6px}
.dest-head .ext{color:var(--gold);white-space:nowrap}
.host{
  margin:10px 0 0;font-family:var(--f-serif);font-weight:700;
  font-size:clamp(20px,2.5vw,30px);line-height:1.25;letter-spacing:-.005em;
  overflow-wrap:anywhere;
}
.path{
  margin:4px 0 0;font:12px/1.7 var(--f-en);letter-spacing:.04em;
  color:rgba(242,237,226,.58);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.url{
  margin:6px 0 0;font:10.5px/1.7 var(--f-sans);letter-spacing:.01em;
  color:rgba(242,237,226,.4);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.from-line{
  margin:10px 0 0;font-family:var(--f-serif);font-size:11.5px;letter-spacing:.06em;
  color:rgba(242,237,226,.5);
}
.from-line b{font-weight:500;color:rgba(242,237,226,.72)}
.from-line[hidden]{display:none}

/* ---------- 动作 ---------- */
.actions{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;margin-top:clamp(22px,3.4vh,32px);
}
.btn{
  display:inline-flex;align-items:center;justify-content:space-between;gap:14px;
  min-height:50px;padding:0 16px;
  border:1px solid rgba(242,237,226,.42);color:var(--paper);
  font:11px/1 var(--f-en);letter-spacing:.14em;text-transform:uppercase;
  transition:background .25s,color .25s,border-color .25s;
}
.btn span{font-family:var(--f-serif);font-size:14px;letter-spacing:.08em;text-transform:none}
.btn em{font-style:normal;font-size:13px;letter-spacing:0;transition:transform .25s}
.btn:hover,.btn:focus-visible{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.btn.solid{background:var(--cinnabar);border-color:var(--cinnabar)}
.btn.solid:hover,.btn.solid:focus-visible{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.btn:hover .a-out{transform:translate(2px,-2px)}
.btn:hover .a-back{transform:translateX(-2px)}

.count{
  display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 10px;
  margin:14px 0 0;
  font:10px/1.6 var(--f-en);letter-spacing:.14em;text-transform:uppercase;
  color:rgba(242,237,226,.5);
}
.count b{font:400 13px/1 var(--f-en);letter-spacing:.06em;color:rgba(242,237,226,.85);font-variant-numeric:tabular-nums}
.count .cn{font-family:var(--f-serif);font-size:12px;letter-spacing:.04em;text-transform:none;color:rgba(242,237,226,.65)}
.count .cancel{
  margin-left:auto;padding:4px 0;min-height:28px;
  font:10px/1.6 var(--f-en);letter-spacing:.14em;text-transform:uppercase;
  color:rgba(242,237,226,.75);text-decoration:underline;text-underline-offset:3px;
}
.count .cancel:hover{color:var(--paper)}
.count .done{display:none;font-family:var(--f-serif);font-size:12px;letter-spacing:.04em;text-transform:none;color:var(--gold)}
.count[data-state="off"] b,
.count[data-state="off"] .auto-text,
.count[data-state="off"] .cancel{display:none}
.count[data-state="off"] .done{display:inline}

/* 没有目标地址时：只留一句说明和回首页 */
body.is-broken .dest{display:none}
body.is-broken .count{display:none}
body.is-broken .actions{grid-template-columns:minmax(0,220px)}

/* ---------- 页脚 ---------- */
.foot{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px;
  padding:14px var(--pad) 18px;border-top:1px solid var(--line);
  font:9px/1.7 var(--f-en);letter-spacing:.13em;text-transform:uppercase;
  color:rgba(242,237,226,.45);
}
.foot .cn{font-family:var(--f-serif);font-size:11px;letter-spacing:.08em;text-transform:none;color:rgba(242,237,226,.62)}
.foot kbd{font:inherit;font-size:9px;border:1px solid rgba(242,237,226,.28);padding:2px 5px;letter-spacing:.08em}

/* ---------- 响应式 ---------- */
@media(max-width:560px){
  .bar{padding:13px var(--pad)}
  .bar-tag{display:none}
  .main{padding-top:clamp(30px,6vh,48px)}
  .actions{grid-template-columns:1fr}
  .btn{width:100%}
  .footer-hint{display:none}
  .foot{flex-direction:column;align-items:flex-start;gap:6px}
}
</style>
</head>
<body>

<header class="bar">
  <a class="brand" href="index.html" aria-label="返回潇贺古道首页">
    <span class="brand-mark" aria-hidden="true">潇</span>
    <span class="brand-txt"><span class="brand-cn">潇贺古道</span><span class="brand-en">XIAOHE ANCIENT ROAD</span></span>
  </a>
  <span class="bar-tag"><b>离站</b>INTERSTITIAL</span>
</header>

<main class="main">
  <div class="sheet">

    <p class="label"><i></i><span id="label">离站 · External Link</span></p>
    <h1 id="title">即将离开本站</h1>
    <p class="lede" id="lede">你将前往一个外部网站，内容与隐私由对方负责。</p>

    <section class="dest" aria-label="目标地址">
      <div class="dest-head">
        <span>目标地址 / Destination</span>
        <span class="ext" id="destTag">外部网站</span>
      </div>
      <p class="host" id="host">—</p>
      <p class="path" id="path" dir="ltr">—</p>
      <p class="url" id="full" dir="ltr">—</p>
      <p class="from-line" id="fromLine" hidden>来自 <b id="from">—</b></p>
    </section>

    <div class="actions">
      <a class="btn solid" id="go" href="index.html" rel="noopener">
        <span>继续前往</span><em class="a-out" aria-hidden="true">↗</em>
      </a>
      <button class="btn" type="button" id="stay">
        <span>留在本站</span><em class="a-back" aria-hidden="true">←</em>
      </button>
    </div>

    <p class="count" id="count" data-state="on">
      <b id="countNum" aria-hidden="true">09</b>
      <span class="cn auto-text">秒后自动前往，按 Esc 取消</span>
      <span class="done" id="countState">已取消自动前往</span>
      <button class="cancel" type="button" id="cancel">取消</button>
    </p>

  </div>
</main>

<footer class="foot">
  <span class="cn">© 2026 潇贺古道有声文化数据库</span>
  <span class="footer-hint"><kbd>Esc</kbd> 取消并留下</span>
</footer>

<noscript>
  <p class="lede" style="position:fixed;left:0;right:0;bottom:0;z-index:10;margin:0;padding:14px var(--pad);background:#0A0E0C;border-top:1px solid var(--line)">
    这个中转页需要 JavaScript 才能读出目标地址。请返回<a href="index.html" style="text-decoration:underline">首页</a>，或直接打开你要访问的链接。
  </p>
</noscript>

<script>
(function(){
  'use strict';

  var $ = function(id){ return document.getElementById(id); };
  var params = new URLSearchParams(location.search);

  /* ---- 目标地址：只认 http/https ---- */
  var target = null;
  var raw = params.get('to') || '';
  if (raw) {
    try {
      var u = new URL(raw, location.href);
      if (u.protocol === 'http:' || u.protocol === 'https:') target = u;
    } catch (err) { target = null; }
  }
  var newTab = params.get('tab') === '1';
  var autoOff = params.get('auto') === '0';

  /* ---- 来源页：?from= 优先，其次 referrer ---- */
  function sourceName(){
    var from = params.get('from') || '';
    var path = '';
    try { if (from) path = new URL(from, location.href).pathname; } catch (e) {}
    if (!path) {
      try { if (document.referrer) path = new URL(document.referrer).pathname; } catch (e) {}
    }
    if (!path) return '';
    var tail = path.split('/').pop() || '';
    if (!tail || tail === 'index.html') return '站点首页';
    if (tail === 'database.html') return '数据库';
    if (tail === 'leave.html') return '中转页';
    var name = tail.replace(/\.html$/i, '').replace(/^\d+-/, '');
    try { name = decodeURIComponent(name); } catch (e) {}
    return (path.indexOf('/themes/') > -1 ? '专题页 · ' : '') + name;
  }

  var hostEl = $('host'), pathEl = $('path'), fullEl = $('full'), fromEl = $('from');
  var go = $('go'), stay = $('stay');
  var count = $('count'), countNum = $('countNum'), countState = $('countState'), cancelBtn = $('cancel');

  var source = sourceName();
  if (source) {
    fromEl.textContent = source;
    $('fromLine').hidden = false;
  }

  if (target) {
    hostEl.textContent = target.hostname.replace(/^www\./, '');
    pathEl.textContent = (target.pathname + target.search + target.hash) || '/';
    fullEl.textContent = target.href;
    fullEl.title = target.href;
    go.setAttribute('href', target.href);
    if (newTab) $('destTag').textContent = '新标签页打开';
  } else {
    document.body.classList.add('is-broken');
    document.title = '没有目标地址 · 潇贺古道有声文化数据库';
    $('title').textContent = '没有目标地址';
    $('label').textContent = '离站 · Interstitial';
    $('lede').textContent = '这个页面需要用 ?to= 参数指明要去的地址。';
    go.innerHTML = '<span>回到首页</span><em class="a-back" aria-hidden="true">←</em>';
    go.setAttribute('href', 'index.html');
    stay.style.display = 'none';
  }

  /* ---- 离开 ---- */
  function leave(){
    if (!target) return;
    stopCount();
    if (newTab) {
      var w = null;
      try { w = window.open(target.href, '_blank'); } catch (e) {}
      if (w) { try { w.opener = null; } catch (e) {} return; }
    }
    location.href = target.href;
  }
  go.addEventListener('click', function(e){
    if (!target) return;                                           /* 降级态：正常回首页 */
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;  /* 交给浏览器开新页 */
    e.preventDefault();
    leave();
  });

  /* ---- 留下 ---- */
  function stayNow(){
    stopCount();
    var same = false;
    try {
      if (document.referrer) same = new URL(document.referrer).origin === location.origin;
    } catch (e) {}
    if (same && history.length > 1) history.back();
    else location.href = 'index.html';
  }
  stay.addEventListener('click', function(e){
    e.preventDefault();
    stayNow();
  });

  /* ---- 倒计时 ---- */
  var AUTO = 9, left = AUTO, timer = null;
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function stopCount(){ if (timer) { clearInterval(timer); timer = null; } }
  function cancelCount(msg){
    stopCount();
    count.dataset.state = 'off';
    countState.textContent = msg || '已取消自动前往';
  }
  function startCount(){
    if (!target || newTab || autoOff) return;
    countNum.textContent = pad(left);
    timer = window.setInterval(function(){
      left -= 1;
      countNum.textContent = pad(Math.max(left, 0));
      if (left > 0) return;
      stopCount();
      if (document.hidden) { cancelCount('页面不在前台，已暂停'); return; }
      leave();
    }, 1000);
  }

  if (target && !newTab && !autoOff) {
    cancelBtn.addEventListener('click', function(){ cancelCount(); });
    startCount();
  } else {
    cancelBtn.style.display = 'none';
    cancelCount(!target ? '' : newTab ? '将在新标签页打开，本站不会离开' : '已关闭自动前往');
    if (!target) count.style.display = 'none';
  }

  /* ---- Esc 永远等于“留下” ---- */
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape' && e.key !== 'Esc') return;
    if (timer) { e.preventDefault(); cancelCount(); }
    else { e.preventDefault(); stayNow(); }
  });
})();
</script>
</body>
</html>
