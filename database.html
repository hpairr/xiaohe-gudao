/* 换页：整页底色交给 body 的 --main（.62s 过渡），#app 只做退场/入场。
   用 WAAPI 而不是 CSS 类，是为了连续点击时能取消上一条动画：
   旧页 150ms 退场 → 提交新页 → 460ms 入场，底色在两者之间完成换册。 */
const SECT_OF = {archive:'archive',detail:'detail',sounds:'sounds',atlas:'atlas',city:'city',about:'about'};
let routeKeyLast = null;
let routeAnim = null;

/* 数据库页开场：只有整屏渐变色退开；不搬白色标题，节奏比专题页紧 */
function finishArrival(){
  const veil = document.getElementById('arrivalVeil');
  document.documentElement.classList.remove('is-arriving','is-revealing','is-arrival-landed');
  if(veil) veil.style.display = 'none';
  try{
    const url = new URL(location.href);
    if(url.searchParams.has('arrive')){
      url.searchParams.delete('arrive');
      history.replaceState(null, '', url.pathname + url.search + url.hash);
    }
  }catch(err){}
}
function runArrival(){
  const veil = document.getElementById('arrivalVeil');
  if(!veil || !document.documentElement.classList.contains('is-arriving')){
    finishArrival();
    return;
  }
  /* 让渐变先在整屏上落稳，再在下一帧退开 */
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      document.documentElement.classList.add('is-revealing');
      window.setTimeout(finishArrival, 380);
    });
  });
}
window.addEventListener('pageshow', event => {
  if(event.persisted && document.documentElement.classList.contains('is-arriving')) finishArrival();
});

function pageTitle(path, param){
  const base = L.logo_cn;
  let name = '';
  if(path==='archive') name = L.ar_title;
  else if(path==='sounds') name = L.snd_title;
  else if(path==='atlas') name = L.at_title;
  else if(path==='about') name = L.ab_title;
  else if(path==='city') name = safeDecode(param);
  else if(path==='detail'){
    const it = ALL.find(x=>x.id===safeDecode(param));
    name = it ? (currentLang()==='zh-CN' ? it.name : (NAME_EN[it.id]||it.name).replace(/【[^】]*】/g,'')) : '';
  }
  else name = L.notfound;
  return name ? name+' · '+base : base;
}

function route(opts){
  opts = opts || {};
  const raw = location.hash.replace(/^#\/?/, '');
  const parts = raw.split('/').filter(Boolean);
  const path = parts[0] || 'home';
  const param = parts[1] || '';
  const routeKey = location.hash || '#/archive';
  const routeChanged = routeKey !== routeKeyLast;
  L = I18N[currentLang()];
  document.documentElement.lang = currentLang();
  document.title = pageTitle(path, param);
  document.querySelectorAll('.lang-select').forEach(s=>{ s.value = currentLang(); });
  const burgerEl = document.getElementById('burgerBtn');
  if(burgerEl) burgerEl.setAttribute('aria-label', L.nav_menu);
  const drawerEl = document.getElementById('drawer');
  if(drawerEl) drawerEl.setAttribute('aria-label', L.nav_menu);

  let html = '', bind = null;
  if(path==='home'){ window.location.replace('index.html'); return; }
  else if(path==='archive'){ html = viewArchive(); bind = bindArchive; }
  else if(path==='detail'){ html = viewDetail(safeDecode(param)); bind = bindDetail; }
  else if(path==='sounds'){ html = viewSounds(); bind = bindSounds; }
  else if(path==='atlas'){ html = viewAtlas(); bind = bindAtlas; }
  else if(path==='city'){ html = viewCity(safeDecode(param)); }
  else if(path==='about'){ html = viewAbout(); }
  else html = `<section><div class="container"><div class="empty">404 · ${L.notfound}</div></div></section>`;

  /* 纸色在退场开始时就换，旧页淡出时已经能看到新纸 */
  document.body.dataset.sect = SECT_OF[path] || 'archive';

  const commit = ()=>{
    const prevY = window.scrollY;
    app.innerHTML = html;
    document.querySelectorAll('[data-i18n]').forEach(el=>{ const k=el.dataset.i18n; if(L[k]!==undefined) el.textContent=L[k]; });
    document.querySelectorAll('#mainNav a').forEach(a=>a.classList.toggle('active', a.dataset.nav===path));
    if(routeChanged){
      const status = document.getElementById('routeStatus');
      if(status) status.textContent = document.title;
    }
    if(opts.keepScroll){ window.scrollTo(0, prevY); } else { window.scrollTo(0,0); }
    if(bind) bind();
    observeReveals();
    initHeroInk();
    mqEnsure();
    initTassel();   /* 首页跑马灯下的丝状摆动装饰(其它页没有 #tasselInner, 会自动跳过) */
    /* 第一屏已经按自己的纸色画好，再允许后续换页做颜色过渡 */
    if(document.body.classList.contains('no-sect-transition')){
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        document.body.classList.remove('no-sect-transition');
      }));
    }
  };

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canAnimate = !opts.keepScroll && routeKeyLast !== null &&
                     routeKey !== routeKeyLast && !reduceMotion && !!app.animate;
  routeKeyLast = routeKey;

  if(!canAnimate){
    if(routeAnim){ routeAnim.cancel(); routeAnim = null; }
    commit();
    return;
  }

  if(routeAnim) routeAnim.cancel();
  const out = app.animate(
    [{opacity:1, transform:'translateY(0)'},{opacity:0, transform:'translateY(-8px)'}],
    {duration:150, easing:'cubic-bezier(.4,0,1,1)', fill:'forwards'}
  );
  routeAnim = out;
  out.finished.then(()=>{
    if(routeAnim !== out) return;
    commit();
    const enter = app.animate(
      [{opacity:0, transform:'translateY(14px)'},{opacity:1, transform:'translateY(0)'}],
      {duration:460, easing:'cubic-bezier(.16,1,.3,1)'}
    );
    routeAnim = enter;
    out.cancel();          /* 撤掉 forwards 填充；入场动画在它之后合成，不会闪 */
    enter.finished.then(()=>{ if(routeAnim===enter) routeAnim = null; }).catch(()=>{});
  }).catch(err=>{
    if(err && err.name !== 'AbortError') console.error('route transition failed', err);
  });
}
function safeDecode(s){
  try{ return decodeURIComponent(s); }catch(e){ return s; }  /* 非法编码不崩溃,回退原样 */
}
function rerender(){ route({keepScroll:true}); }
function observeReveals(){
  const els = document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){ els.forEach(el=>el.classList.add('in')); return; }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, {threshold:0.12, rootMargin:'0px 0px -8% 0px'});
  els.forEach(el=>io.observe(el));
}
/* 标题墨晕 v5: 全自动随机墨晕(不与鼠标联动)
   每隔几秒自己晕一次: 墨滴随机落在四个字中的**任意一个**(中间两个字也会轮到),
   再沿随机墨流方向洇向左右邻居 —— 离墨滴越远的字墨越淡、起晕越晚, 最后一起收干。 */
function initHeroInk(){
  const title = document.querySelector('.hero h1');
  if(!title || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const chars = Array.from(title.querySelectorAll('span'));
  if(!chars.length) return;
  if(title.dataset.ink) return;
  title.dataset.ink = '1';

  /* —— 节奏参数(想更快/更慢/更浓只改这里) —— */
  const MAX_BLUR = 5;     /* 墨滴那个字的模糊上限 px */
  const MAX_FADE = .14;   /* 墨滴那个字的减淡幅度(墨被水洇开的感觉) */
  const RISE     = 1600;  /* 晕开用时 ms */
  const FALL     = 2200;  /* 收干用时 ms */
  const SPREAD   = 600;   /* 墨滴到最远那个字的起晕时差 ms(墨洇过去的快慢) */
  const GAP_MIN  = 300;   /* 两轮墨晕之间的最小间隔 ms */
  const GAP_MAX  = 900;   /* 最大间隔 ms */
  /* 墨流朝向候选: (x,y) 表示「墨尾 → 墨头」 */
  const DIRS = [[1,1],[1,0],[1,-1],[-1,1],[-1,0],[-1,-1]];

  let raf = 0, timer = 0, visible = true;

  const clearInk = ()=>chars.forEach(sp=>{ sp.style.filter = ''; sp.style.opacity = ''; });
  function schedule(delay){
    clearTimeout(timer); timer = 0;
    if(!visible || !title.isConnected) return;
    timer = setTimeout(pulse, delay === undefined ? (GAP_MIN + Math.random()*(GAP_MAX-GAP_MIN)) : delay);
  }
  function pulse(){        /* 一轮墨晕: 落点 / 墨量 / 洇开范围 / 墨流朝向 全部随机 */
    timer = 0;
    if(!visible || !title.isConnected) return;
    const dir    = DIRS[(Math.random()*DIRS.length)|0];
    const gain   = .70 + Math.random()*.30;        /* 每轮墨量都不同 */
    const spread = .45 + Math.random()*.55;        /* 洇开范围: 偏小就只洇到旁边一个字 */
    const tr = title.getBoundingClientRect();
    const cx = tr.left + tr.width/2, cy = tr.top + tr.height/2;
    const rs = chars.map(sp=>sp.getBoundingClientRect());
    /* 四字中心在墨流轴上的投影 → 归一化成 0 … 1 的轴上位置 */
    const proj = rs.map(r=>((r.left + r.width/2 - cx)*dir[0] + (r.top + r.height/2 - cy)*dir[1]));
    const lo   = Math.min.apply(null, proj);
    const span = Math.max(1, Math.max.apply(null, proj) - lo);
    const pos  = proj.map(v=>(v - lo)/span);
    /* 墨滴落在哪个字上 —— 四个字机会均等(中间也会轮到), 再随机偏一点 */
    const src  = pos[(Math.random()*chars.length)|0] + (Math.random()-.5)*.16;
    const w = [], delay = [];
    let far = 0;
    pos.forEach(v=>{
      let ww = Math.max(0, 1 - Math.abs(v - src)/spread);   /* 离墨滴越远墨越淡 */
      if((v - src)*dir[0] > 0) ww *= .78;                   /* 顺流前方再淡一点 → 留住渐变方向感 */
      w.push(ww);
      const dl = Math.abs(v - src)*SPREAD;                  /* 离墨滴越远起晕越晚 */
      delay.push(dl);
      if(dl > far) far = dl;
    });
    const total = far + RISE + FALL;
    const t0 = performance.now();
    (function frame(now){
      const el = now - t0;
      chars.forEach((sp,i)=>{
        const u = el - delay[i];
        let env = 0;
        if(u > 0){
          if(u < RISE){ const p = u/RISE; env = p*p*(3-2*p); }                        /* 晕开: 两头都慢, 不突兀 */
          else if(u < RISE + FALL){ const q = (u-RISE)/FALL; env = 1 - q*q*(3-2*q); } /* 收干: 两头都慢, 不突兀 */
        }
        const k = env * w[i] * gain;
        if(k > .015){
          sp.style.filter  = 'blur(' + (k*MAX_BLUR).toFixed(2) + 'px)';
          sp.style.opacity = (1 - k*MAX_FADE).toFixed(3);
        } else { sp.style.filter = ''; sp.style.opacity = ''; }
      });
      if(el < total && visible && title.isConnected){ raf = requestAnimationFrame(frame); }
      else { raf = 0; clearInk(); schedule(); }
    })(t0);
  }
  /* 首屏滚出视野就停(省电), 滚回来自动接着随机晕 */
  if('IntersectionObserver' in window){
    new IntersectionObserver(es=>{
      visible = es[es.length-1].isIntersecting;
      if(visible){ if(!timer && !raf) schedule(); }
      else { clearTimeout(timer); timer = 0; if(raf) cancelAnimationFrame(raf); raf = 0; clearInk(); }
    }, {threshold:0}).observe(title);
  }
  schedule(2600);   /* 第一轮等入场动画(约 1.6s)跑完, 再缓一口气开始 */
}

/* ================================================================
   跑马灯下的「丝状摆动装饰」
   ----------------------------------------------------------------
   形象：跑马灯是一条横着走的带，它下面挂一排丝缕 —— 上端钉死在带底边，
        下端自由垂落。滚轮一推，带子走、丝缕也跟着荡。
   物理：每根独立解一个阻尼摆方程
            Ω″ = −k·tanh(Ω) − c·Ω′                     （摆动，k=重力/摆长）
            s″ = k_s·(1 − s) − c_s·s′                 （竖向微伸展，重力回正）
        摆幅按下端加权：y/L ∈ [0,1] 线性加权 → 上端钉住、下端摆得最多，
        与 hero/01-女书文字帘 同一套"悬挂物"思路(那边是 WebGL 里的 Verlet 重力绳):
        都只由可追溯的单一输入驱动,静止时不动,没有任何随机抖动。
   激励：滚轮改变带子速度，速度阶跃以角冲量注入（见 tasScrollImpulse）。
   省电：整段滚出视野就停；prefers-reduced-motion 时整体不动，交给 CSS 兜底。
   ================================================================ */
/* ================================================================
   丝缕：Verlet 积分 + 约束松弛（Jakobsen《Advanced Character Physics》）
   ----------------------------------------------------------------
   每根丝 = 一串质点，相邻两点之间是一根「刚性杆」（约束）。
     ① 积分：x' = 2x − x* + a·Δt²      —— 不存速度，能量自然耗散，最稳
     ② 约束：把每段长度拉回 seg        —— 论文 §4 的 stick 约束
     ③ 松弛：每帧迭代 TAS_ITER 次，逐个满足局部约束
     ④ 钉点：迭代后把顶端节点压回锚点（带子上的位置）
   没有角度钳位，也没有「按角度画出来的假曲线」：
   弯曲、下垂、甩出去的弧线，全部由重力 + 约束迭代自己长出来。
   驱动来自带子的横向加速度 —— 丝挂在带子上，带子被滚轮推动，惯性把丝甩向反方向。
   ================================================================ */
const TAS_SEG = 14;          /* 每段长度 px（越大越硬挺） */
const TAS_ITER = 14;         /* 每帧松弛次数：约束越硬，丝被甩时也不容易被拉长 */
const TAS_GRAV = 3200;       /* 重力 px/s²：调小 = 摆得慢、飘（真丝不是钢珠） */
const TAS_DRAG = 0.075;      /* 线性阻力：摆动好几秒才自然停住 */
const TAS_RAIL_K = 5.0;      /* 拖拽系数 1/s：带子以相对速度拖着丝走
                                （越大越跟手、摆幅越小；越小越飘、摆得越大） */
/* 不做任何「气流 / 微扰」噪声：上一版加了 wind + jitter 两个噪声项，
   幅度比滚轮信号还大，看起来就是无来由地乱抖。
   现在丝只服从一条因果链：滚轮 → 带子加速度 → 惯性甩动。
   每根之间的差异只来自重力/阻力系数（物理量），不再有随机相位。
   标定：1000px/s 滚动 → 锚点加速度约 7500px/s²，相对重力 3200 ≈ 2.3 → 明显甩动。 */
let tasItems = [], tasRaf = 0, tasLastY = null, tasLastTs = 0, tasVisible = true;
/* 调试句柄（可删）：控制台里 window.__tassel.tune({ drive:40 }) 即时改参数 */
window.__tassel = {
  items: function(){ return tasItems; },
  state: function(){ return { visible: tasVisible, raf: tasRaf, lastTs: tasLastTs,
                              reduced: tasReduced(), n: tasItems.length }; },
  tune: function(o){
    if(o.grav != null) TAS_GRAV = o.grav;
    if(o.iter != null) TAS_ITER = o.iter;
    return [TAS_GRAV, TAS_ITER];
  }
};

function tasReduced(){ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

function tasEnsure(){
  const inner = document.getElementById('tasselInner');
  if(!inner) { tasItems = []; return false; }
  if(inner.dataset.built === '1' && tasItems.length) return true;
  tasItems = [];
  inner.dataset.built = '1';
  const W = inner.clientWidth || 1200;
  const H = inner.clientHeight || 132;
  /* 间距 = 跑马灯循环长度 ÷ 循环内应有的点位个数。
     带子横移时按**容器宽度**取模回绕（不能按循环长度，那会绕出屏幕）。 */
  const span = (mqLoop > 0) ? mqLoop / Math.max(1, Math.round(mqLoop / 112)) : 112;
  const count = Math.max(4, Math.floor(W / span) + 1);
  window.__tasW = W;
  const BOXW = 40;                       /* 元素宽：结点摆动的活动范围 */
  const DX = BOXW / 2;                   /* 丝的横向中心（元素内坐标） */
  for(let i = 0; i < count; i++){
    const t = count === 1 ? .5 : i / (count - 1);
    const bell = 0.78 + 0.22 * Math.sin(Math.PI * t);   /* 中间略长、两侧略短 */
    const len = Math.min(H * 0.92, H * (0.62 + 0.28 * bell));
    const n = Math.max(4, Math.round(len / TAS_SEG));
    const seg = len / n;                                /* 实际段长，保证总长正好 len */
    const nodes = [], old = [];
    for(let k = 0; k <= n; k++){
      nodes.push(DX, k * seg);                          /* x,y 交错存，避免对象分配 */
      old.push(DX, k * seg);
    }
    const boxH = Math.ceil(len);
    const el = document.createElement('div');
    el.className = 'tas';
    el.style.height = boxH + 'px';
    /* 关键：SVG 与元素同尺寸、viewBox 同数值 → **像素即坐标系**。
       上一版用固定 40 宽的 viewBox 去套被拉伸的高度，
       圆形的节点被非等比缩放挤成菱形，就是你看到的「黄三角」。 */
    el.innerHTML = '<span class="knot"></span>' +
      '<svg viewBox="0 0 ' + BOXW + ' ' + boxH + '" preserveAspectRatio="none">' +
      '<path class="th" stroke-width="' + (0.8 + 0.6 * bell).toFixed(2) + '" d=""/>' +
      '</svg>';
    inner.appendChild(el);
    tasItems.push({
      el: el, path: el.querySelector('path.th'),
      nodes: nodes, old: old, n: n, seg: seg, L: len, boxH: boxH, dx: DX,
      x0: i * span,
      /* 每根的差异只来自物理量：重力与阻力系数 */
      g: 0.90 + (i % 5) * 0.05,          /* 0.90 ~ 1.10 */
      dr: 0.90 + (i % 4) * 0.05          /* 0.90 ~ 1.05 */
    });
  }
  return tasItems.length > 0;
}

/* 丝缕形变：
   ① 横向位置 = 带子上的基准位置 + 带子当前位移，按**容器宽度**取模回绕
      —— 注意不能按「循环长度」回绕：循环长度只有容器宽的一半，
        那样会有一半丝缕被绕到屏幕外（这是本轮实测发现的错）。
   ② 绕顶端旋转（transform-origin:50% 0）——顶端永远钉在横杆上；
   ③ 竖向微伸展（s>1 时整体拉长并反向缩 Y）。 */
/* 丝缕形变：
   ① 横向位置 = 带子上的基准位置 + 带子当前位移，按**容器宽度**取模回绕
      —— 注意不能按「循环长度」回绕：循环长度只有容器宽的一半，
        那样会有一半丝缕被绕到屏幕外（这是实测发现的错）。
   ② 绕顶端旋转（transform-origin:50% 0）——顶端永远钉在横杆上；
   ③ 中心线是一条二次曲线，弯曲量由**摆角**决定（不是角速度）：
      丝缕被整根转过去时，如果只做 rotate，看起来就是一根硬棒在转；
      把「尖端位移」改由曲线承担，上端先走、下端还在后面，才有丝的滑感。
      做法：尖端相对顶端的横向位移 tip = L·sinΩ ≈ L·Ω（小角），
      二次曲线用控制点中点时，尖端位移 ≈ bend/2，所以 bend ≈ 2·L·Ω。
/* 丝缕渲染（无硬钳位）：
   ① 横向位置 = 带子上的基准位置 + 带子当前位移，按**容器宽度**取模回绕。
   ② 摆角 Ω 不做物理钳位 —— 物理层完全自由，允许摆过 ±90°（真实丝缕被甩就是这样）。
      姿态完全由 tasSimulate 的物理决定，这里不做任何角度塑形。 */
/* 一个物理子步：① 力 → ② Verlet 积分 → ③ 约束松弛 → ④ 钉点 */
/* 一个物理子步：① 力 → ② Verlet 积分 → ③ 约束松弛 → ④ 钉点
   唯一的驱动力是带子的横向加速度（丝挂在带子上，带子被滚轮推动）。 */
/* 一个物理子步：① 力（重力 + 带子拖拽） → ② Verlet 积分 → ③ 约束松弛 → ④ 钉点

   驱动力用**拖拽模型**，不是任意的噪声，也不是加速度差分：
   丝被带子带着走，每个结点受到与「入口带子速度 − 结点自身速度」成正比的力。
     · Verlet 里结点速度就是 (x − x*)/Δt，所以这项可以直接写出来；
     · 带子一动，丝被拖着滞后跟上 → 自然产生摆动与相位滞后；
     · 拖拽是耗散的（力总与相对速度同向），所以绝不会发散，也不需要钳位。
   除此之外没有任何风、抖动、随机相位 —— 每根的差异只来自重力与阻力系数。 */
function tasSimulate(h, railV){
  const h2 = h * h;
  const invH = 1 / h;
  for(let i = 0; i < tasItems.length; i++){
    const it = tasItems[i];
    const nd = it.nodes, od = it.old, n = it.n;
    const g = TAS_GRAV * it.g;
    const dmp = 1 - TAS_DRAG * it.dr;
    const kDrag = TAS_RAIL_K * it.g;
    for(let k = 1; k <= n; k++){
      const p = k << 1;
      const x = nd[p], y = nd[p + 1];
      const vx = (x - od[p]) * invH;          /* Verlet 隐含速度 */
      /* 加速度 = 重力 + 拖拽（把结点横向速度往带子速度上拉） */
      const ax = (railV - vx) * kDrag;
      const nx = x + (x - od[p]) * dmp + ax * h2;
      const ny = y + (y - od[p + 1]) * dmp + g * h2;
      od[p] = x; od[p + 1] = y;
      nd[p] = nx; nd[p + 1] = ny;
    }
    for(let it2 = 0; it2 < TAS_ITER; it2++){
      for(let k = 0; k < n; k++){
        const p = k << 1, q = p + 2;
        let dx = nd[q] - nd[p], dy = nd[q + 1] - nd[p + 1];
        const d = Math.sqrt(dx * dx + dy * dy) || 1e-6;
        const diff = (d - it.seg) / d * 0.5;
        dx *= diff; dy *= diff;
        nd[p] += dx; nd[p + 1] += dy;
        nd[q] -= dx; nd[q + 1] -= dy;
      }
      nd[0] = it.dx; nd[1] = 0;               /* 钉点：顶端压回锚点 */
    }
  }
}

/* 渲染：按结点画一条平滑曲线（二次贝塞尔穿过每个结点） */
/* 渲染：结点坐标本来就在像素空间（元素内坐标），直接用，不做换算。
   曲线用「二次贝塞尔穿过各段中点、以结点为控制点」的常规做法 —— 平滑且穿过所有结点。 */
function tasRender(){
  for(let i = 0; i < tasItems.length; i++){
    const it = tasItems[i], nd = it.nodes, n = it.n;
    let d = 'M' + nd[0].toFixed(2) + ' ' + nd[1].toFixed(2);
    if(n < 2){ it.path.setAttribute('d', d); continue; }
    d += ' Q' + nd[2].toFixed(2) + ' ' + nd[3].toFixed(2) + ' ' +
         ((nd[0] + nd[2]) / 2).toFixed(2) + ' ' + ((nd[1] + nd[3]) / 2).toFixed(2);
    for(let k = 1; k < n - 1; k++){
      const p = k << 1, q = p + 2, r = p + 4;
      d += ' Q' + nd[q].toFixed(2) + ' ' + nd[q + 1].toFixed(2) + ' ' +
           ((nd[q] + nd[r]) / 2).toFixed(2) + ' ' + ((nd[q + 1] + nd[r + 1]) / 2).toFixed(2);
    }
    const e = n << 1;
    d += ' Q' + nd[e - 2].toFixed(2) + ' ' + nd[e - 1].toFixed(2) + ' ' +
         nd[e].toFixed(2) + ' ' + nd[e + 1].toFixed(2);
    it.path.setAttribute('d', d);
  }
}

/* 姿态由物理决定（tasRender 画曲线），定位只管横向平移 */
function tasPaint(it, railX){
  const W = window.__tasW || 0;
  let x = it.x0 + railX;
  if(W > 0){ x = ((x % W) + W) % W; }
  it.el.style.transform = 'translate3d(' + x.toFixed(2) + 'px,0,0)';
}

function tasFrame(ts){
  tasRaf = 0;
  if(!tasVisible || document.hidden) return;
  if(!tasLastTs) tasLastTs = ts;
  let dt = (ts - tasLastTs) / 1000;
  tasLastTs = ts;
  if(!(dt > 0)) dt = 1 / 60;
  if(dt > 0.10) dt = 0.10;

  /* 带子速度 = 本帧内实际滚过的像素 ÷ 帧时长。
     滚轮一推就有值、停手立刻为 0，无需任何衰减常数。 */
  const scrolled = window.__tasScrollPx || 0;
  window.__tasScrollPx = 0;
  let railV = scrolled / dt;
  /* 上限：狂甩时也不至于把丝抽直 */
  if(railV > 3000) railV = 3000;
  if(railV < -3000) railV = -3000;
  window.__tasRailVel = railV;

  /* 固定子步长：Verlet 对步长敏感，1/90s 足够稳 */
  let rest = dt;
  while(rest > 1e-6){
    const h = Math.min(1 / 90, rest);
    rest -= h;
    tasSimulate(h, railV);
  }
  tasRender();
  for(let i = 0; i < tasItems.length; i++) tasPaint(tasItems[i], mqPos);
  tasRaf = requestAnimationFrame(tasFrame);
}

function tasScrollImpulse(dy){
  if(!tasItems.length || tasReduced() || !tasVisible) return;
  /* 只累加「这一次滚动走了多少像素」；方向由符号带出。
     带子的真实速度在 tasFrame 里用「本帧累计位移 ÷ 帧时长」求 —— 这是唯一
     可靠的量：滚轮每格之间隔十几毫秒，事件自带的速度归一化值不可靠。 */
  window.__tasScrollPx = (window.__tasScrollPx || 0) + dy;
  if(!tasRaf) tasRaf = requestAnimationFrame(tasFrame);
}

function initTassel(){
  if(!tasEnsure()) return;
  if(tasReduced()){
    /* 减动效模式交给 CSS 的那份极轻摆动，这里只把初始角度清干净 */
    tasRender();
    return;
  }
  tasLastTs = 0;
  if(!tasRaf) tasRaf = requestAnimationFrame(tasFrame);
  /* 滚出视野就停 */
  const host = document.getElementById('tassel');
  if(host && 'IntersectionObserver' in window){
    new IntersectionObserver(es=>{
      tasVisible = es[es.length - 1].isIntersecting;
      if(tasVisible){ if(!tasRaf) tasRaf = requestAnimationFrame(tasFrame); }
      else if(tasRaf){ cancelAnimationFrame(tasRaf); tasRaf = 0; }
    }, {threshold:0}).observe(host);
  }
  document.addEventListener('visibilitychange', ()=>{
    tasLastTs = 0;
    if(!document.hidden && tasVisible && !tasRaf) tasRaf = requestAnimationFrame(tasFrame);
  });
}

window.addEventListener('resize', ()=>{
  const inner = document.getElementById('tasselInner');
  if(inner){
    inner.dataset.built = '0';
    inner.innerHTML = '';
    if(tasRaf){ cancelAnimationFrame(tasRaf); tasRaf = 0; }
    tasItems = [];
    initTassel();
  }
}, {passive:true});

/* ================================================================
   沿线跑马灯: 由「CSS 匀速自走」改为「跟着页面滚动走」
   滚轮/触控板/键盘滚动都走同一个 scroll 事件, 不必分别处理;
   向下滚 → 条向左走, 向上滚 → 向右走, 收手时带一点惯性。
   (无 JS 时 CSS 动画仍在, 属渐进增强兜底)
   ================================================================ */
const MQ_SPEED = 1;     /* 页面每滚动 1px, 条子横向走多少 px */
const MQ_EASE  = .14;   /* 惯性收紧速度: 越大越跟手 */
let mqTrack = null, mqLoop = 0, mqPos = 0, mqTarget = 0, mqRaf = 0, mqLastY = null, mqReduced = null;
function mqIsReduced(){
  if(mqReduced === null) mqReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  return mqReduced;
}
function mqEnsure(){                 /* 接管轨道 + 量出无缝循环长度 */
  const t = document.querySelector('.mq-top');
  if(t !== mqTrack){ mqTrack = t; mqLoop = 0; mqLastY = window.scrollY || 0; }
  if(!mqTrack) return false;
  /* 关掉 CSS 匀速自走，改由滚动驱动（无 JS 时 CSS 动画仍在，属渐进增强） */
  if(mqTrack.style.animation !== 'none') mqTrack.style.animation = 'none';
  if(!mqLoop){
    const kids = mqTrack.children, half = kids.length >> 1;
    mqLoop = (half && kids[half]) ? (kids[half].offsetLeft - kids[0].offsetLeft)
                                  : mqTrack.scrollWidth / 2;
    if(!(mqLoop > 0)) mqLoop = 0;
  }
  return mqLoop > 0;
}
function mqRender(){
  if(!mqLoop) return;
  const x = -(((-mqPos % mqLoop) + mqLoop) % mqLoop);   /* 归一到 (-loop,0]，无缝循环 */
  mqTrack.style.transform = 'translate3d(' + x.toFixed(2) + 'px,0,0)';
}
function mqFrame(){
  mqRaf = 0;
  const diff = mqTarget - mqPos;
  if(Math.abs(diff) < .05) mqPos = mqTarget;
  else { mqPos += diff * (mqIsReduced() ? 1 : MQ_EASE); mqRaf = requestAnimationFrame(mqFrame); }
  mqRender();
}
function mqSync(){
  if(!mqEnsure()) return;
  const y = window.scrollY || 0;
  if(mqLastY === null){ mqLastY = y; return; }
  const dy = y - mqLastY;
  mqLastY = y;
  if(!dy) return;
  mqTarget -= dy * MQ_SPEED;      /* 向下滚(dy>0) → 向左走 */
  if(!mqRaf) mqRaf = requestAnimationFrame(mqFrame);
}
window.addEventListener('resize', ()=>{ mqLoop = 0; }, {passive:true});
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ mqLoop = 0; });

window.addEventListener('hashchange', route);
window.addEventListener('scroll', ()=>{
  const vh = window.innerHeight || 1;
  const scY = window.scrollY || 0;
  /* 丝缕先吃滚动冲量（与跑马灯同源，两者一定同相位） */
  const tasDy = (window.__tasLastY == null) ? 0 : (scY - window.__tasLastY);
  window.__tasLastY = scY;
  if(tasDy) tasScrollImpulse(tasDy);
  const p = Math.min(scY / vh, 1);
  const bg = document.querySelector('.hero-bg');
  if(bg) bg.style.transform = 'scale(' + Math.max(0.85, 1 - p*0.15) + ')';
  const inner = document.querySelector('.hero-inner');
  if(inner) inner.style.transform = 'translateY(' + (-p * vh*0.4) + 'px)';
  const cta = document.querySelector('.hero .cta');
  if(cta) cta.style.opacity = String(Math.max(0, 1 - p*1.6));
  /* 六主题图片视差: 图片在装裱框内随滚动微移 */
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.querySelectorAll('.t-media img').forEach(img=>{
      const row = img.closest('.topic-row');
      if(!row) return;
      const r = row.getBoundingClientRect();
      const c = r.top + r.height/2 - vh/2;
      img.style.transform = 'translateY(' + (-c*0.045).toFixed(1) + 'px) scale(1.1)';
    });
  }
  mqSync();   /* 跑马灯跟着滚动走 */
}, {passive:true});
