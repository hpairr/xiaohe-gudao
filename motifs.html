<meta name="theme-color" content="#1D2652">
<script>
/* 首帧底色（2026-11-07）
   ------------------------------------------------------------------
   这一页是「专题页 → 详情页」过场的落点：专题页最后铺满整屏的圆盘用的是
   该页的 --main，所以详情页第一次绘制就必须是同一個色。原来 body 写死
   #1D2652，除女书外五个主题都会闪一帧错色（本机 1~4 帧，慢网下几十毫秒）。
   这里在 <body> 之前就把色值设好，再由 fill() 接管。
   BOOT 的色值必须与脚本里的 THEMES 一致，selftest 会反查（bootMatchesThemes）。 */
(function () {
  var BOOT = {
    nushu:     { bg: '#1D2652', fg: '#F2EDE2' },
    butterfly: { bg: '#B8862F', fg: '#141A16' },
    drum:      { bg: '#A9362E', fg: '#FFFFFF' },
    bridge:    { bg: '#4C6C8B', fg: '#FFFFFF' },
    panwang:   { bg: '#15120F', fg: '#F2EDE2' },
    brocade:   { bg: '#5E3F55', fg: '#F2EDE2' }
  };
  window.__MO_BOOT = BOOT;
  var KEYS = ['nushu', 'butterfly', 'drum', 'bridge', 'panwang', 'brocade'];
  var q = new URLSearchParams(location.search);
  var key = q.get('theme');
  if (KEYS.indexOf(key) < 0) {
    var n = parseInt(q.get('open'), 10);
    key = (!isNaN(n) && n >= 0 && n < 6) ? KEYS[n] : 'nushu';
  }
  var t = BOOT[key];
  var root = document.documentElement;
  root.style.setProperty('--boot-bg', t.bg);
  root.style.setProperty('--boot-fg', t.fg);
  var mt = document.querySelector('meta[name="theme-color"]');
  if (mt) mt.setAttribute('content', t.bg);
  function preload(href) {
    var l = document.createElement('link');
    l.rel = 'preload';
    l.as = 'image';
    l.href = href;
    document.head.appendChild(l);
  }
  /* 图案整图（≈250~340KB）提前开始下载，别等 fill() 才发请求 */
  preload('assets/img/motifs/m' + (KEYS.indexOf(key) + 1) + '-' + key + '.webp');
  /* 各层（188×188，合计 250~300KB）也提前要：它们才是「换页首帧」上要看见的东西。
     只要在 <head> 里就发请求，首绘时大概率已经解码完，落点那一帧就不会空。
     层数写在这里、与 #layer-data 里的清单是两处，selftest 用 layerPreloadCount 反查。 */
  var LANE = { nushu: 7, butterfly: 7, drum: 9, bridge: 7, panwang: 6, brocade: 8 };
  window.__MO_LAYER_COUNT = LANE;
  for (var li = 1; li <= LANE[key]; li++) {
    preload('assets/theme-pattern/layers/' + key + '-layer-' + ('0' + li).slice(-2) + '.png');
  }
})();
</script>

<style id="mo-style">

@font-face{font-family:'Noto Serif SC';src:url('assets/fonts/site/NotoSerifSC-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Noto Serif SC';src:url('assets/fonts/site/NotoSerifSC-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Noto Sans SC';src:url('assets/fonts/site/NotoSansSC-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Noto Sans SC';src:url('assets/fonts/site/NotoSansSC-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}

:root{
  --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',STSong,'SimSun',serif;
  --sans:'Noto Sans SC','Source Han Sans SC','Microsoft YaHei','PingFang SC',sans-serif;
  --pad:clamp(20px,4.4vw,64px);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{scrollbar-gutter:stable;background:var(--boot-bg,#1D2652)}
body{
  margin:0;overflow:hidden;background:var(--boot-bg,#1D2652);color:var(--boot-fg,#F2EDE2);
  font:400 15px/1.8 var(--sans);-webkit-font-smoothing:antialiased;
}
img{max-width:100%}

/* 整页就是这幅图案的解释：底色 = 专题页的底色，字色 = 专题页的字色 */
.mo-detail{
  --bg:var(--boot-bg,#1D2652);--fg:var(--boot-fg,#F2EDE2);
  --soft:#C9C6D8;--line:rgba(242,237,226,.18);--line-soft:rgba(242,237,226,.1);
  --ac:var(--boot-fg,#F2EDE2);
  position:fixed;inset:0;background:var(--bg);color:var(--fg);overflow:hidden;
}

/* ── 图案：正中 ─────────────────────────────────────────────── */
.mo-plate img{-webkit-user-drag:none;user-select:none}
.mo-plate{
  position:absolute;left:0;top:0;background:var(--bg);
}
/* 整图压在各层之上：整图没到时先由「各层叠起来」顶住画面，
   两层其实是同一幅画，整图到了再交叉淡入换成清晰版。 */
.mo-plate .base{
  display:block;position:absolute;inset:0;z-index:2;
  width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .18s linear;
}
/* 第一帧不要过渡：图案要么已经在，要么还没有；从 0 淡入的那 120ms
   正是「转到详情页闪一下」的来源（首帧空白 → 图案慢慢浮上来）。 */
.mo-plate.is-first .base,.mo-plate.is-first .mo-stack img{transition:none}
.mo-stack{position:absolute;inset:0;z-index:1}
.mo-stack img{
  position:absolute;inset:0;width:100%;height:100%;
  /* 与 .base 同长：两层同时反着淡，合成后总不透明度一直是 1，
     否则半路会出现「图案先暗一下再亮回来」的第二次闪 */
  transition:opacity .18s linear;
}

/* ── 左：编号与名字 ─────────────────────────────────────────── */
.mo-meta{
  position:absolute;left:var(--pad);top:50%;
  width:clamp(230px,22vw,300px);text-align:center;
  opacity:0;transform:translateY(calc(-50% + 12px));
  transition:opacity .5s var(--ease),transform .6s var(--ease);
}
.mo-detail.is-in .mo-meta{opacity:1;transform:translateY(-50%)}
.mo-meta .no{font:700 clamp(40px,4.6vw,64px)/1 var(--serif);color:var(--ac)}
.mo-meta .cn{margin-top:16px;font:500 clamp(20px,2vw,28px)/1.25 var(--serif);white-space:nowrap}
.mo-meta .en{margin-top:8px;font:400 9.5px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.mo-meta .vrule{margin:18px auto 0;width:1px;height:clamp(40px,7vh,72px);background:var(--line)}
.mo-meta .back{margin-top:14px;font:400 11px/1.6 var(--sans);letter-spacing:.06em;color:var(--soft);text-decoration:none;display:inline-block;text-align:center}
.mo-meta .back:hover{color:var(--fg)}
.mo-head{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;align-items:center;gap:10px}
.mo-title{min-width:0;text-align:center}
.mo-nav{
  width:34px;height:34px;border:1px solid var(--line);border-radius:50%;
  background:transparent;color:var(--soft);font:400 16px/1 var(--sans);
  display:grid;place-items:center;cursor:pointer;padding:0;
}
.mo-nav:hover{color:var(--fg);border-color:var(--fg)}
.mo-nav[hidden]{display:none}
.mo-nav.is-off{visibility:hidden;pointer-events:none}


/* ── 右：分层解释 ──────────────────────────────────────────── */
.mo-panel{
  position:absolute;right:var(--pad);top:clamp(84px,11vh,120px);bottom:clamp(84px,11vh,120px);
  width:clamp(250px,22vw,310px);
  padding-left:clamp(14px,1.4vw,22px);border-left:1px solid var(--line);
  overflow-y:auto;overscroll-behavior:contain;
}
.mo-panel::-webkit-scrollbar{width:3px}
.mo-panel::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.mo-panel .phead{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding-bottom:10px;border-bottom:1px solid var(--fg);
  opacity:0;transform:translateY(8px);
  transition:opacity .5s var(--ease),transform .55s var(--ease);
}
.mo-detail.is-in .mo-panel .phead{opacity:1;transform:none}
.mo-panel .phead b{font:500 13px/1 var(--serif);letter-spacing:.05em}
.mo-panel .phead span{font:400 10px/1 var(--sans);letter-spacing:.14em;color:var(--soft)}
.mo-layer{
  display:grid;grid-template-columns:26px 1fr;gap:8px 10px;width:100%;
  padding:11px 6px 12px 4px;border:0;border-bottom:1px solid var(--line-soft);background:none;
  text-align:left;color:inherit;font:inherit;cursor:pointer;
  opacity:0;transform:translateY(10px);
  transition:opacity .45s var(--ease),transform .5s var(--ease),background-color .22s;
}
.mo-detail.is-in .mo-layer{opacity:1;transform:none}
@media (hover:hover){.mo-layer:hover{background:color-mix(in srgb,var(--fg) 8%,transparent)}}
.mo-layer:focus-visible{outline:1px solid currentColor;outline-offset:-2px}
.mo-layer .lno{font:400 10px/1.7 var(--sans);letter-spacing:.06em;color:var(--soft);font-variant-numeric:tabular-nums}
.mo-layer .lname{font:500 15px/1.5 var(--serif)}
.mo-layer .lbody{grid-column:2;font:400 12.5px/1.8 var(--sans);color:var(--soft)}
.mo-layer[aria-pressed="true"]{background:color-mix(in srgb,var(--fg) 12%,transparent)}
.mo-layer[aria-pressed="true"] .lname{color:var(--ac)}

/* ── 窄屏标题 / 关闭 ──────────────────────────────────────── */
.mo-mtitle{
  display:none;position:absolute;left:var(--pad);top:14px;right:64px;z-index:2;
  align-items:baseline;gap:10px;
  font:500 15px/1.2 var(--serif);opacity:0;transition:opacity .5s var(--ease);
}
.mo-detail.is-in .mo-mtitle{opacity:1}
.mo-mtitle b{font:700 20px/1 var(--serif);color:var(--ac)}
.mo-close{
  position:absolute;right:var(--pad);top:16px;z-index:2;
  display:grid;place-items:center;width:38px;height:38px;
  border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--fg);
  cursor:pointer;opacity:0;
  transition:opacity .5s var(--ease),background-color .25s,color .25s,border-color .25s;
}
.mo-detail.is-in .mo-close{opacity:1}
.mo-close:hover{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.mo-sound{
  position:absolute;right:calc(var(--pad) + 48px);top:16px;z-index:3;
  height:38px;padding:0 14px;border:1px solid var(--line);border-radius:19px;
  background:transparent;color:var(--soft);font:400 10px/1 var(--sans);
  letter-spacing:.06em;cursor:pointer;opacity:0;
  transition:opacity .5s var(--ease),background-color .25s,color .25s,border-color .25s;
}
.mo-detail.is-in .mo-sound{opacity:1}
.mo-sound:hover{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.mo-sound[aria-pressed="true"]{border-color:var(--ac);color:var(--ac)}

.mo-close:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.mo-close svg{width:14px;height:14px}

/* ── 窄屏：图案在上，说明在下 ────────────────────────────────── */
@media (max-width:999px){
  .mo-meta{display:none}
  .mo-mtitle{display:flex}
  .mo-panel{
    left:0;right:0;top:auto;bottom:0;width:auto;
    max-height:42vh;padding:16px var(--pad) 20px;
    border-left:0;border-top:1px solid var(--line);
    background:var(--bg);
  }
}

/* ── 减少动态 ────────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>

   bg:'#A9362E',fg:'#FFFFFF',soft:.86,ac:'#D2A03F'},
  {k:'bridge',   no:'肆',cn:'富川风雨桥',en:'WIND-RAIN BRIDGE',page:'05-风雨桥.html',
   bg:'#4C6C8B',fg:'#FFFFFF',soft:.88,ac:'#B7C3D6'},
  {k:'panwang',  no:'伍',cn:'盘王大歌',en:'PANWANG DA GE',    page:'06-盘王大歌.html',
   bg:'#15120F',fg:'#F2EDE2',soft:.72,ac:'#D2A03F'},
  {k:'brocade',  no:'陆',cn:'瑶族织锦',en:'YAO BROCADE',     page:'07-富川织锦.html',
   bg:'#5E3F55',fg:'#F2EDE2',soft:.72,ac:'#C08A2E'}
];
var KEYS=THEMES.map(function(t){return t.k;});
var LAYER_DIR='assets/theme-pattern/layers/';

var $=function(s,r){return (r||document).querySelector(s);};
var detail=$('#detail'),plate=$('#plate'),stack=$('#stack'),baseImg=$('#plateBase');
var layerList=$('#layerList'),layerCountEl=$('#layerCount'),panel=$('#panel');
var metaNo=$('#metaNo'),metaCn=$('#metaCn'),metaEn=$('#metaEn'),mTitle=$('#mTitle');
var backLink=$('#backLink'),closeBtn=$('#closeBtn'),selftestEl=$('#selftest');

var FINE=matchMedia('(hover: hover) and (pointer: fine)');

/* 整图是否已就位：没就位时用各层叠出同一幅画顶着（见 .mo-plate .base 注释） */
var baseReady=false, baseToken=0, curHint=-1;

/* ── 图层清单：从内嵌表读（manifest.json 生成，file:// 也能用）── */
var LAYERS={},manifestOK=false,manifestCheck=null;
try{
  LAYERS=JSON.parse($('#layer-data').textContent);
  manifestOK=true;
}catch(e){console.warn('[motifs] 内嵌图层表解析失败：',e);}
if(/^https?:$/.test(location.protocol)){
  fetch(LAYER_DIR+'manifest.json',{cache:'no-cache'})
    .then(function(r){return r.ok?r.json():Promise.reject(new Error('HTTP '+r.status));})
    .then(function(j){
      manifestCheck=(JSON.stringify(j)===JSON.stringify(LAYERS));
      if(!manifestCheck)console.warn('[motifs] 内嵌图层表与 manifest.json 不一致，请重跑 tools/gen-motif-layers.py');
    })
    .catch(function(){});
}

/* ── 当前是哪一幅：?theme=nushu（也接受 ?open=0）────────────── */
function pickIndex(){
  var q=new URLSearchParams(location.search);
  var key=q.get('theme');
  if(key){var i=KEYS.indexOf(key);if(i>=0)return i;}
  var n=parseInt(q.get('open'),10);
  if(!isNaN(n)&&n>=0&&n<6)return n;
  return 0;
}
var cur=pickIndex();

/* ── 颜色工具 ──────────────────────────────────────────────── */
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function lum(rgb){
  var a=rgb.map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});
  return .2126*a[0]+.7152*a[1]+.0722*a[2];
}
function contrast(a,b){var l1=lum(hex2rgb(a)),l2=lum(hex2rgb(b));return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05);}
function mixHex(fg,bg,a){
  var f=hex2rgb(fg),b=hex2rgb(bg);
  return '#'+f.map(function(v,i){return ('0'+Math.round(v*a+b[i]*(1-a)).toString(16)).slice(-2);}).join('');
}

function fill(i){
  var t=THEMES[i],ls=LAYERS[t.k]||[];
  cur=i;
  var pv=$('#prevTheme'),nx=$('#nextTheme');
  if(pv){pv.hidden=false;pv.disabled=(i===0);pv.classList.toggle('is-off',i===0);}
  if(nx){nx.hidden=false;nx.disabled=(i===THEMES.length-1);nx.classList.toggle('is-off',i===THEMES.length-1);}
  var d=detail.style;
  d.setProperty('--bg',t.bg);
  d.setProperty('--fg',t.fg);
  d.setProperty('--soft',mixHex(t.fg,t.bg,t.soft));
  d.setProperty('--line','color-mix(in srgb,'+t.fg+' 22%,'+t.bg+')');
  d.setProperty('--line-soft','color-mix(in srgb,'+t.fg+' 12%,'+t.bg+')');
  d.setProperty('--ac',contrast(t.ac,t.bg)>=3?t.ac:t.fg);
  document.body.style.background=t.bg;
  var mt=document.querySelector('meta[name="theme-color"]');
  if(mt)mt.setAttribute('content',t.bg);

  metaNo.textContent=t.no;metaCn.textContent=t.cn;metaEn.textContent=t.en;
  mTitle.innerHTML='<b></b><span></span>';
  mTitle.firstChild.textContent=t.no;
  mTitle.lastChild.textContent=t.cn;
  backLink.href='themes/'+t.page+'?arrive='+t.k;
  backLink.textContent='← 回到'+t.cn;
  document.title=t.cn+' · 图案分层解释';

  baseImg.src='assets/img/motifs/m'+(i+1)+'-'+t.k+'.webp';
  baseImg.alt=t.cn+'图案';

  /* 整图没解码之前，先让各层叠出同一幅画（层次序比整图低一层）。
     首帧就位、且不要过渡：直接从 1 开始，不做 0→1 的淡入。 */
  plate.classList.add('is-first');
  baseReady=false;
  baseImg.style.opacity='0';
  var token=++baseToken;
  /* 整图到了只做一件事：在层图**之上**把它淡进来。
     绝不能同时把层图淡出 —— 两层同时反着淡时，合成后的总不透明度在交叉点会掉到
     ≈0.75（1−t+t²），图案先暗一下再亮回来，看起来就是「像加载图片那样闪一下」。
     等整图铺满（.18s + 余量）之后，再把层图撤掉；那时它被整图整块盖住，撤掉看不见。 */
  var mark=function(){
    if(token!==baseToken||baseReady) return;
    baseReady=true;
    baseImg.style.opacity='1';
    setTimeout(function(){ if(token===baseToken) isolate(curHint); },240);
  };
  if(baseImg.decode) baseImg.decode().then(mark,mark);
  else if(baseImg.complete) mark();
  else baseImg.addEventListener('load',mark,{once:true});

  stack.textContent='';
  ls.forEach(function(L,n){
    var im=document.createElement('img');
    im.src=LAYER_DIR+L.file;im.alt='';
    /* sync：七层要在同一帧里就位。async 会让它们摊到好几帧解码，
       落点那一下就是「图案一层层叠上来」，看着像闪。图很小，同步解码不亏。 */
    im.decoding='sync';im.loading='eager';
    im.dataset.i=String(n);
    im.style.opacity='1';
    /* 供测量用：PerformanceObserver('element') 能拿到这一层真正上屏的时间，
       用来核对「首绘 → 图案上屏」是不是同一帧（elementtiming 不影响渲染） */
    im.setAttribute('elementtiming','mo-layer');
    stack.appendChild(im);
  });

  layerCountEl.textContent=ls.length+' 层';
  layerList.textContent='';
  panel.scrollTop=0;
  if(!ls.length){
    var p=document.createElement('p');
    p.style.cssText='margin:14px 0;font-size:12.5px';
    p.textContent='图层清单未加载。';
    layerList.appendChild(p);
  }
  ls.forEach(function(L,n){
    var b=document.createElement('button');
    b.type='button';b.className='mo-layer';b.dataset.i=String(n);
    b.style.transitionDelay=(160+n*45)+'ms';
    b.setAttribute('aria-pressed','false');
    b.innerHTML='<span class="lno">'+('0'+(n+1)).slice(-2)+'</span><span class="lname"></span>';
    b.querySelector('.lname').textContent=L.name;
    if(L.desc){
      var body=document.createElement('span');
      body.className='lbody';
      body.textContent=L.desc;
      b.appendChild(body);
    }
    b.addEventListener('click',function(){isolate(n);});
    b.addEventListener('pointerenter',function(){if(FINE.matches)isolate(n);});
    b.addEventListener('pointerleave',function(){if(FINE.matches)isolate(-1);});
    b.addEventListener('focus',function(){isolate(n);});
    layerList.appendChild(b);
  });
  isolate(-1);
}

function isolate(n){
  curHint=n;
  var imgs=stack.children;
  var showLayers=!baseReady||n>=0;
  for(var k=0;k<imgs.length;k++){
    var on=(n<0)||(+imgs[k].dataset.i===n)||(+imgs[k].dataset.i===0&&imgs.length>1);
    imgs[k].style.opacity=(n<0)?(showLayers?'1':'0'):(on?'1':'0');
  }
  baseImg.style.opacity=(n<0&&baseReady)?'1':'0';
  var rows=layerList.children;
  for(var j=0;j<rows.length;j++) rows[j].setAttribute('aria-pressed',(+rows[j].dataset.i===n)?'true':'false');
}

/* 内容浮入：等图案版式这一帧算完再起跑（两帧 rAF），不会在版式未定时先浮字。
   第二帧起撤掉「首帧无过渡」，之后整图换清晰版才有交叉淡入。 */
function revealNow(){
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      detail.classList.add('is-in');
      plate.classList.remove('is-first');
    });
  });
}

/* ── 版式：图案居中，左侧名字，右侧解释 ────────────────────── */
function layout(){
  var vw=innerWidth,vh=innerHeight,wide=vw>=1000;
  var padPx=parseFloat(getComputedStyle(panel).right)||20;   /* --pad 是 clamp() 字面量，直接 parseFloat 会得到 20，要从算出来的样式取 */
  var size;
  if(wide){
    var metaW=$('.mo-meta').getBoundingClientRect().width||180;
    var panelW=panel.getBoundingClientRect().width||310;
    var side=padPx+Math.max(metaW,panelW)+20;
    size=Math.round(Math.min(vh*.80, vw-2*side));
  }else{
    size=Math.round(Math.min(vh*.46, vw*.94));
  }
  var cx=vw/2, cy=wide?vh*.5:vh*.28;
  plate.style.width=size+'px';plate.style.height=size+'px';
  plate.style.transform='translate3d('+(cx-size/2)+'px,'+(cy-size/2)+'px,0)';
  return {size:size,cx:cx,cy:cy,wide:wide};
}
var G=layout();
addEventListener('resize',function(){G=layout();});

/* 图案先就位（与专题页过场的落点同一套公式），再让内容浮上来。
   整图（≈250~340KB）晚到也不空盘：没解码出来之前，先由已经缓存住的那几层
   188×188 透明 PNG 叠出同一幅画（专题页上的就是它们，所以落点这一帧和过场
   最后一帧是同一张图），整图到了再交叉淡入换成清晰版。 */
fill(cur);
revealNow();

/* ── 返回：直接回对应的专题页 ──────────────────────────────── */
function back(){ location.href='themes/'+THEMES[cur].page+'?arrive='+THEMES[cur].k; }
closeBtn.addEventListener('click',back);
backLink.addEventListener('click',function(e){e.preventDefault();back();});
detail.addEventListener('click',function(e){
  if(suppressBack){suppressBack=false;e.preventDefault();e.stopPropagation();return;}
  if(e.target===detail||e.target===plate||e.target.classList.contains('base'))back();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){e.preventDefault();back();}
});

/* ── 左右切换图案详情 ─────────────────────────────────────── */
var prevTheme=$('#prevTheme'),nextTheme=$('#nextTheme');
function stepTheme(delta){
  var n=cur+delta;
  if(n<0||n>=THEMES.length)return;
  fill(n);
  try{history.replaceState(null,'','?theme='+THEMES[n].k);}catch(err){}
  switchAudio(THEMES[n].k,0);
}
if(prevTheme)prevTheme.addEventListener('click',function(){stepTheme(-1);});
if(nextTheme)nextTheme.addEventListener('click',function(){stepTheme(1);});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'){e.preventDefault();stepTheme(-1);}
  if(e.key==='ArrowRight'){e.preventDefault();stepTheme(1);}
});


/* ── 详情页音乐：接住专题页进度，切主题时交叉淡入 ───────────── */
var AUDIO_STATE='xiaohe-audio-state';
var SOUND_KEY='xiaohe-sound';
var VOLUME_KEY='xiaohe-volume';
var audioA=document.getElementById('detailAudioA');
var audioB=document.getElementById('detailAudioB');
var soundBtn=document.getElementById('soundBtn');
var audioActive=null,audioStandby=null,audioKey=THEMES[cur].k;
var audioMuted=false,audioBlocked=false,audioLevel=.62;
try{
  audioMuted=localStorage.getItem(SOUND_KEY)==='off';
  var savedVol=parseFloat(localStorage.getItem(VOLUME_KEY));
  if(isFinite(savedVol))audioLevel=Math.max(0,Math.min(1,savedVol))*.62;
}catch(e){}
function audioTarget(){return audioMuted?0:audioLevel;}
function setAudioButton(){
  if(!soundBtn)return;
  var playing=!!audioActive&&!audioActive.paused&&!audioMuted;
  soundBtn.textContent=audioMuted?'开启声音':(playing?'静音':'播放');
  soundBtn.setAttribute('aria-pressed',audioMuted?'true':'false');
  soundBtn.setAttribute('aria-label',audioMuted?'开启声音':(playing?'静音':'播放背景音乐'));
}
function fadeAudio(el,to,duration,done){
  if(!el)return;
  var from=el.volume,start=performance.now();
  function step(now){
    var p=Math.min(1,(now-start)/Math.max(1,duration));
    el.volume=Math.max(0,Math.min(1,from+(to-from)*p));
    if(p<1)requestAnimationFrame(step);
    else if(done)done();
  }
  requestAnimationFrame(step);
}
function writeAudioState(){
  try{
    sessionStorage.setItem(AUDIO_STATE,JSON.stringify({
      key:audioKey,
      position:audioActive?Math.max(0,audioActive.currentTime||0):0,
      playing:!!audioActive&&!audioActive.paused&&!audioMuted,
      at:Date.now()
    }));
  }catch(e){}
}
function playAudio(el,position){
  if(!el)return;
  audioBlocked=false;
  el.volume=0;
  var start=function(){
    try{
      var d=isFinite(el.duration)&&el.duration>0?el.duration:0;
      var p=Math.max(0,Number(position)||0);
      if(d)p=p%d;
      el.currentTime=p;
    }catch(e){}
    var promise=el.play();
    if(promise&&promise.catch)promise.catch(function(){audioBlocked=true;setAudioButton();});
    fadeAudio(el,audioTarget(),500,setAudioButton);
  };
  if(el.readyState>=1)start();
  else el.addEventListener('loadedmetadata',start,{once:true});
  setAudioButton();
}
function switchAudio(key,position){
  if(!audioA||!audioB)return;
  audioKey=key;
  if(!audioActive){
    audioActive=audioA;audioStandby=audioB;
    audioActive.dataset.key=key;
    audioActive.src='assets/audio/'+key+'.mp3';
    audioActive.loop=true;
    if(!audioMuted)playAudio(audioActive,position||0);
    else setAudioButton();
    return;
  }
  if(audioActive.dataset.key===key){
    if(!audioMuted&&audioActive.paused)playAudio(audioActive,position||0);
    else if(!audioMuted)fadeAudio(audioActive,audioTarget(),300,setAudioButton);
    else setAudioButton();
    return;
  }
  var old=audioActive,next=audioStandby;
  next.dataset.key=key;
  next.src='assets/audio/'+key+'.mp3';
  next.loop=true;
  next.volume=0;
  fadeAudio(old,0,300,function(){try{old.pause();}catch(e){}});
  audioActive=next;
  audioStandby=old;
  if(!audioMuted)playAudio(next,position||0);
  else setAudioButton();
  setAudioButton();
}
function toggleAudio(){
  if(audioMuted){
    audioMuted=false;
    try{localStorage.setItem(SOUND_KEY,'on');}catch(e){}
    if(audioActive&&audioActive.paused)playAudio(audioActive,audioActive.currentTime||0);
    else if(audioActive)fadeAudio(audioActive,audioTarget(),300,setAudioButton);
  }else if(audioActive&&audioActive.paused){
    playAudio(audioActive,audioActive.currentTime||0);
  }else{
    audioMuted=true;
    try{localStorage.setItem(SOUND_KEY,'off');}catch(e){}
    if(audioActive)fadeAudio(audioActive,0,250,function(){
      try{audioActive.pause();}catch(e){}
      setAudioButton();
    });
  }
  setAudioButton();
  writeAudioState();
}
if(soundBtn)soundBtn.addEventListener('click',toggleAudio);
if(audioA&&audioB){
  audioA.addEventListener('playing',setAudioButton);
  audioB.addEventListener('playing',setAudioButton);
  audioA.addEventListener('pause',setAudioButton);
  audioB.addEventListener('pause',setAudioButton);
  audioActive=audioA;audioStandby=audioB;
  audioActive.dataset.key=audioKey;
  audioActive.src='assets/audio/'+audioKey+'.mp3';
  audioActive.loop=true;
  var savedState=null;
  try{savedState=JSON.parse(sessionStorage.getItem(AUDIO_STATE)||'null');}catch(e){}
  if(savedState&&savedState.key===audioKey&&savedState.playing&&Date.now()-(savedState.at||0)<30000&&!audioMuted){
    playAudio(audioActive,(Number(savedState.position)||0)+(Date.now()-(savedState.at||0))/1000);
  }else{
    setAudioButton();
  }
}
addEventListener('pagehide',writeAudioState);
addEventListener('beforeunload',writeAudioState);


/* ── 左右滑动切换 ─────────────────────────────────────────── */
var suppressBack=false;
(function(){
  var sx=0,sy=0,down=false;
  detail.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    if(e.target.closest('button,a,.mo-panel,.mo-close,.mo-sound'))return;
    e.preventDefault();
    sx=e.clientX;sy=e.clientY;down=true;
  });
  detail.addEventListener('pointerup',function(e){
    if(!down)return;
    down=false;
    var dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4){
      suppressBack=true;
      setTimeout(function(){suppressBack=false;},400);
      stepTheme(dx<0?1:-1);
    }
  });
  detail.addEventListener('pointercancel',function(){down=false;});
})();

/* ── 自检 ──────────────────────────────────────────────────── */
function whenLoaded(list,ms){
  return new Promise(function(res){
    var t0=performance.now();
    (function poll(){
      if(list.every(function(i){return i.complete;})||performance.now()-t0>ms)return res();
      setTimeout(poll,40);
    })();
  });
}

async function runSelfTest(){
  var out={ok:true,fails:[],detail:{}};
  function chk(n,c,v){out.detail[n]=v;if(!c){out.ok=false;out.fails.push(n);}}

  var t=THEMES[cur];
  chk('themePicked',cur===pickIndex(),cur);
  chk('manifest',manifestOK,Object.keys(LAYERS).length);
  /* 首帧底色表与 THEMES 必须一致：两处色值漂移会让换页闪一帧错色 */
  var BOOT=window.__MO_BOOT||{};
  chk('bootMatchesThemes',KEYS.every(function(k){
    var x=THEMES[KEYS.indexOf(k)];
    return BOOT[k]&&BOOT[k].bg===x.bg&&BOOT[k].fg===x.fg;
  }),KEYS.map(function(k){return k+':'+(BOOT[k]&&BOOT[k].bg);}).join(' '));
  var tw=Date.now();
  while(manifestCheck===null&&Date.now()-tw<1600){await new Promise(function(r){setTimeout(r,80);});}
  chk('layerDataMatchesManifest',manifestCheck===null||manifestCheck===true,manifestCheck);

  var cs=getComputedStyle(detail);
  chk('bgApplied',cs.getPropertyValue('--bg').trim()===t.bg,cs.getPropertyValue('--bg').trim());
  chk('fgApplied',cs.getPropertyValue('--fg').trim()===t.fg,cs.getPropertyValue('--fg').trim());

  var imgs=[].slice.call(stack.querySelectorAll('img'));
  await whenLoaded(imgs,5000);
  /* 预载层数（head 里写死的表）必须与清单一致，否则首帧会缺层 */
  var LANE=window.__MO_LAYER_COUNT||{};
  chk('layerPreloadCount',LANE[t.k]===(LAYERS[t.k]||[]).length,LANE[t.k]+'/'+((LAYERS[t.k]||[]).length));
  /* 整图就位后各层才让位；没就位时是「各层叠出整幅」的状态 */
  var twb=Date.now();
  while(!baseReady&&Date.now()-twb<3000){await new Promise(function(r){setTimeout(r,40);});}
  chk('baseReady',baseReady,true);
  chk('stackLoaded',imgs.length>0&&imgs.every(function(i){return i.complete&&i.naturalWidth>0;}),
      imgs.map(function(i){return i.naturalWidth;}));
  chk('rows',layerList.children.length===imgs.length,layerList.children.length);
  chk('rowsHaveNames',Array.prototype.every.call(layerList.querySelectorAll('.lname'),function(n){return n.textContent.trim().length>0;}),true);
  chk('noInstructionText',!/点击|查看|点开/.test(detail.textContent),true);

  var pr=plate.getBoundingClientRect();
  chk('plateCentered',Math.abs(pr.left+pr.width/2-G.cx)<=2&&Math.abs(pr.top+pr.height/2-G.cy)<=2,
      [Math.round(pr.left+pr.width/2),Math.round(pr.top+pr.height/2)]);
  chk('plateSize',Math.abs(pr.width-G.size)<=1,Math.round(pr.width));

  isolate(1);
  var st=imgs.map(function(i){return i.style.opacity;});
  chk('isolateSelected',st[1]==='1',st.join(','));
  chk('isolateOthers',st.every(function(v,k){return k===0||k===1||v==='0';}),st.join(','));
  chk('isolateBaseHidden',baseImg.style.opacity==='0',baseImg.style.opacity);
  isolate(-1);
  chk('isolateRestore',imgs.every(function(i){return i.style.opacity==='0';})&&baseImg.style.opacity==='1',
      imgs.map(function(i){return i.style.opacity;}).join(',')+' base '+baseImg.style.opacity);
  /* 整图没就位时必须是「各层全显、整图隐藏」，否则落点会空盘 */
  var savedReady=baseReady;
  baseReady=false;isolate(-1);
  chk('fallbackLayersVisible',imgs.every(function(i){return i.style.opacity==='1';})&&baseImg.style.opacity==='0',
      imgs.map(function(i){return i.style.opacity;}).join(',')+' base '+baseImg.style.opacity);
  baseReady=savedReady;isolate(-1);

  var cr={};
  var soft=mixHex(t.fg,t.bg,t.soft);
  cr['fg/bg']=+contrast(t.fg,t.bg).toFixed(2);
  cr['soft/bg']=+contrast(soft,t.bg).toFixed(2);
  chk('contrast:fg',cr['fg/bg']>=4.5,cr['fg/bg']);
  chk('contrast:soft',cr['soft/bg']>=4.5,cr['soft/bg']);
  var acRGB=cs.getPropertyValue('--ac').trim();
  chk('contrast:accent',contrast(acRGB,t.bg)>=3,+contrast(acRGB,t.bg).toFixed(2));
  THEMES.forEach(function(x){
    cr['theme:'+x.k]='fg '+contrast(x.fg,x.bg).toFixed(2)+' / soft '+contrast(mixHex(x.fg,x.bg,x.soft),x.bg).toFixed(2);
  });
  out.detail.contrast=cr;

  chk('backHref',backLink.getAttribute('href')==='themes/'+t.page+'?arrive='+t.k,backLink.getAttribute('href'));
  chk('reducedMotionCSS',$('#mo-style').textContent.indexOf('prefers-reduced-motion')>-1,true);
  /* is-in 现在等整图 decode 才加（见 reveal），自检要等它，不能同步断言 */
  var tw3=Date.now();
  while(!detail.classList.contains('is-in')&&Date.now()-tw3<1500){await new Promise(function(r){setTimeout(r,40);});}
  chk('reachedIn',detail.classList.contains('is-in'),true);
  out.detail.viewport=[innerWidth,innerHeight];
  out.detail.plate=Math.round(pr.width);

  selftestEl.hidden=false;
  selftestEl.textContent='SELFTEST '+JSON.stringify(out,null,1);
  document.title=(out.ok?'SELFTEST-OK ':'SELFTEST-FAIL ')+document.title;
  if(!out.ok)console.warn('[motifs] selftest fails:',out.fails);
}

if(new URLSearchParams(location.search).get('selftest')==='1') runSelfTest();
})();
</script>
